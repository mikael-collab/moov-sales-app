<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOOV Sales">
<title>MOOV Sales v6.170</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{height:100%;}
body{height:100%;font-family:'Heebo','Arial Hebrew',Arial,sans-serif;background:#f0f0f0;overflow:hidden;}
#app{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  background:#f5f5f5;overflow:hidden;
}
/* Header */
.hdr{flex-shrink:0;padding:12px 14px 10px;background:#1a73e8;color:#fff;transition:background .25s;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;}
.hdr-mid{text-align:center;flex:1;}
.hdr-mid h1{font-size:16px;font-weight:600;margin:0;}
.hdr-mid p{font-size:11px;opacity:.75;margin:0;}
.hdr-mid p.inv-totals{font-size:15px;font-weight:700;opacity:1;margin:2px 0 0;letter-spacing:.2px;}
.hdr-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;width:36px;height:36px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.hdr-btn.hidden{visibility:hidden;}
/* Content */
#content{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}
/* Bottom Nav */
.bnav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid #e0e0e0;padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 9px;border:none;background:transparent;cursor:pointer;font-family:inherit;border-top:2.5px solid transparent;transition:border-color .2s,color .2s,background .2s;color:#aaa;}
.bnav-btn .ico{font-size:18px;margin-bottom:2px;}
.bnav-btn .lbl{font-size:9px;font-weight:500;white-space:nowrap;line-height:1;}
/* Search */
.sbar{background:#fff;border-bottom:1px solid #ebebeb;padding:10px 12px;position:sticky;top:0;z-index:10;}
.swrap{position:relative;}
.sinput{width:100%;padding:10px 36px 10px 30px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;background:#f8f8f8;outline:none;direction:rtl;-webkit-appearance:none;}
.sico{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.sinput:focus ~ .sico {color:#1a73e8;}
.sclr{position:absolute;left:9px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:#bbb;cursor:pointer;line-height:1;}
.smeta{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:#aaa;}
.sref{background:none;border:none;font-size:11px;font-family:inherit;cursor:pointer;}
/* Cards */
.card{margin:0 10px 5px;border-radius:11px;overflow:hidden;border:1.5px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card.exp{border-color:var(--tc);box-shadow:0 3px 14px rgba(0,0,0,.12);}
.card-hdr{padding:12px 14px;cursor:pointer;user-select:none;}
.r1{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap;}
.r2{display:flex;gap:9px;font-size:12px;color:#555;flex-wrap:wrap;align-items:center;}
.r3{margin-top:5px;display:flex;justify-content:space-between;align-items:center;}
.card-body{border-top:1.5px solid rgba(0,0,0,.07);padding:12px 14px 14px;background:#fff;}
.cust-name{font-weight:600;font-size:15px;color:#1a1a1a;flex-shrink:0;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.biz-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.toggle-hint{font-size:11px;}
.id-badge{font-size:12px;color:#444;background:rgba(0,0,0,.09);border-radius:6px;padding:2px 8px;font-family:monospace;letter-spacing:1px;flex-shrink:0;}
.copy-btn{border:1px solid rgba(0,0,0,.18);border-radius:6px;padding:2px 8px;font-size:11px;background:rgba(255,255,255,.6);color:#444;cursor:pointer;font-family:inherit;flex-shrink:0;}
.copy-btn.done{color:#fff;}
.tag{font-size:11px;background:rgba(0,0,0,.08);border-radius:5px;padding:1px 7px;color:#444;white-space:nowrap;}
.tag.blue{background:#ddeeff;color:#1a73e8;}
.nbadge{color:#fff;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600;display:inline-block;}
/* Grid / Detail */
.sec-t{font-size:11px;font-weight:600;color:#aaa;margin-bottom:8px;letter-spacing:.5px;}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.gcell{background:#f8f8f8;border-radius:8px;padding:8px 10px;border:.5px solid #ebebeb;}
.gcell.wide{grid-column:span 2;}
.glabel{font-size:10px;color:#aaa;margin-bottom:2px;}
.gval{font-size:13px;font-weight:500;color:#222;word-break:break-all;}
.dtable{background:#fff;border-radius:10px;border:.5px solid #ebebeb;overflow:hidden;margin-bottom:10px;}
.dthead{padding:8px 12px;font-size:12px;font-weight:600;color:#fff;display:flex;justify-content:space-between;}
.dtrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-top:.5px solid #f0f0f0;}
.dtlabel{font-size:12px;color:#666;flex-shrink:0;padding-left:8px;}
.dtval{font-size:13px;font-weight:500;color:#222;text-align:left;direction:ltr;max-width:55%;overflow:hidden;text-overflow:ellipsis;}
.prod-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:.5px solid #f0f0f0;}
.prod-em{font-size:20px;margin-left:8px;}
.prod-name{font-size:13px;font-weight:500;color:#222;}
.prod-sub{font-size:10px;color:#aaa;}
.prod-qty{font-size:15px;font-weight:700;}
/* Sticky totals bar */
.sticky-totals{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;margin:-14px -14px 14px;
  color:#fff;
  border-bottom:1.5px solid rgba(255,255,255,.2);
}
.sticky-totals .st-cans{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.sticky-totals .st-total{font-size:19px;font-weight:700;}
.fdivider{display:flex;align-items:center;gap:10px;margin:16px 0 13px;}
.fdivider hr{flex:1;border:none;border-top:.5px solid #ddd;}
.fdivider span{font-size:12px;font-weight:600;color:#aaa;white-space:nowrap;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:4px;}
.field label small{font-size:11px;color:#bbb;font-weight:400;}
.finput{display:block;width:100%;padding:10px 13px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:inherit;background:#f8f8f8;outline:none;direction:rtl;-webkit-appearance:none;transition:border-color .2s;}
.finput:focus{border-color:var(--tc,#1a73e8);background:#fff;}
.finput.num{direction:ltr;text-align:right;font-family:monospace;letter-spacing:1px;}
select.finput{cursor:pointer;}
textarea.finput{resize:vertical;min-height:65px;font-size:14px;line-height:1.5;}
.irow{display:flex;gap:8px;}
.dash-btn{padding:10px 16px;border-radius:10px;border:1.5px solid var(--tc,#1a73e8);background:transparent;color:var(--tc,#1a73e8);font-size:22px;font-weight:700;line-height:1;cursor:pointer;flex-shrink:0;}
.save-btn{width:100%;padding:13px;border-radius:10px;color:#fff;border:none;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer;-webkit-appearance:none;transition:background 0.2s;}
.save-btn:disabled{background:#ccc !important;cursor:not-allowed;}
/* Product qty row in form */
.prod-field{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:.5px solid #f0f0f0;direction:ltr;}
.prod-field:last-child{border-bottom:none;}
.pf-left{display:flex;align-items:center;gap:8px;}
.pf-em{font-size:20px;margin-left:0;margin-right:8px;}
.pf-name{font-size:13px;font-weight:500;color:#222;}
.pf-sub{font-size:10px;color:#aaa;}
.pf-input{width:72px;padding:7px 8px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:15px;font-weight:600;text-align:center;font-family:monospace;background:#f8f8f8;-webkit-appearance:none;outline:none;flex-shrink:0;}
.pf-input:focus{border-color:var(--tc,#1a73e8);background:#fff;}
/* Calc row */
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#f8f8f8;border-radius:8px;margin-bottom:6px;}
.calc-label{font-size:12px;color:#666;}
.calc-val{font-size:13px;font-weight:600;color:#222;}
.calc-val.hi{color:var(--tc,#1a73e8);font-size:15px;}
/* Customer suggest */
.field-wrap{position:relative;}
.suggest-box{position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid #e0e0e0;border-top:none;border-radius:0 0 10px 10px;max-height:150px;overflow-y:auto;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.sug-item{padding:9px 13px;cursor:pointer;font-size:14px;color:#333;border-top:.5px solid #f5f5f5;}
.sug-item:first-child{border-top:none;}
.sug-item:active{background:#f0f4ff;}
.sug-sub{font-size:11px;color:#aaa;margin-top:1px;}
/* Alert */
.alert{padding:12px 14px;border-radius:10px;font-weight:500;text-align:center;font-size:14px;margin-bottom:12px;}
.alert.ok{background:#e6f4ea;color:#1e8e3e;}
.alert.err{background:#fce8e6;color:#c62828;}
/* Status */
.status{padding:48px 16px;text-align:center;}
.spinner{width:36px;height:36px;border:3px solid #f0f0f0;border-top-color:#1a73e8;border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
/* Settings */
.set-wrap{padding:14px 14px 40px;}
.stitle{font-size:11px;font-weight:600;color:#aaa;margin:14px 0 6px;letter-spacing:.5px;}
.stitle:first-child{margin-top:0;}
.scard{background:#fff;border-radius:12px;border:.5px solid #ebebeb;overflow:hidden;margin-bottom:4px;}
.srow{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:.5px solid #f0f0f0;}
.srow:first-child{border-top:none;}
.slabel{font-size:13px;color:#444;font-weight:500;}
.sval{font-size:11px;color:#aaa;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;}
.sbtn{background:none;border:none;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;}
.sbtn.red{color:#c62828;}.sbtn.blue{color:#1a73e8;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle;}
.diag-box{background:#111827;border-radius:10px;padding:12px;margin-top:10px;direction:ltr;text-align:left;}
.diag-sheet{margin-bottom:12px;}
.diag-name{font-size:12px;font-weight:600;color:#60a5fa;margin-bottom:5px;}
.diag-grid{display:flex;flex-wrap:wrap;gap:4px;}
.dcell{background:#1e3a5f;border-radius:4px;padding:2px 7px;font-size:10px;font-family:monospace;}
.dk{color:#93c5fd;}.dv{color:#86efac;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;}
.derr{color:#f87171;font-size:11px;}
.url-input{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;font-family:inherit;background:#f8f8f8;outline:none;direction:ltr;text-align:left;-webkit-appearance:none;margin-bottom:10px;}
.url-input:focus{border-color:#1a73e8;background:#fff;}
.url-input.err{border-color:#c62828;}
.url-err{font-size:12px;color:#c62828;margin-bottom:8px;display:none;}
.save-url-btn{width:100%;padding:13px;border-radius:10px;background:#1a73e8;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;}
/* Setup */
.setup-screen{display:flex;flex-direction:column;height:100%;}
.setup-hero{background:linear-gradient(135deg,#1a73e8,#0d47a1);padding:36px 24px 28px;text-align:center;color:#fff;flex-shrink:0;}
.setup-hero .logo{font-size:48px;margin-bottom:8px;}
.setup-hero h2{font-size:22px;font-weight:700;margin-bottom:3px;}
.setup-hero p{font-size:13px;opacity:.8;line-height:1.5;margin:0;}
.setup-body{flex:1;overflow-y:auto;padding:18px 14px 30px;}
.setup-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:.5px solid #e8e8e8;}
.setup-card h3{font-size:14px;font-weight:600;color:#222;margin-bottom:10px;}
.step-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
.step-num{background:#1a73e8;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;}
.step-txt{font-size:13px;color:#444;line-height:1.5;flex:1;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);max-width:360px;width:calc(100% - 32px);padding:13px 16px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:slideUp .2s ease;}
.toast.err{background:#c62828;color:#fff;}
.toast.ok{background:#1e8e3e;color:#fff;}
@keyframes slideUp{from{opacity:0;bottom:60px}to{opacity:1;bottom:80px}}
</style>
</head>
<body>
<div id="app">
  <div id="toast-container"></div>
  <div id="confirm-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(2px);">
    <div style="background:#fff; width:90%; max-width:400px; padding:20px; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,0.25); direction:rtl; text-align:right;">
      <h3 id="confirm-title" style="font-size:16px; font-weight:700; margin-bottom:10px; color:#1a1a1a;">⚠️ שים לב</h3>
      <p id="confirm-text" style="font-size:14px; line-height:1.6; color:#444; margin-bottom:20px; white-space:pre-line;"></p>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button id="confirm-yes" style="padding:10px 20px; border-radius:10px; border:none; background:#1a73e8; color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition: background 0.2s;">כן, המשך</button>
        <button id="confirm-no" style="padding:10px 20px; border-radius:10px; border:1.5px solid #e0e0e0; background:#fff; color:#555; font-size:14px; font-weight:600; cursor:pointer; transition: background 0.2s;">ביטול</button>
      </div>
    </div>
  </div>
  <div class="hdr" id="hdr">
    <div class="hdr-row">
      <button class="hdr-btn" id="back-btn"></button>
      <div class="hdr-mid"><h1 id="hdr-title">לקוחות</h1><p id="hdr-sub">מיקאל קולמן | MOOV</p></div>
      <button class="hdr-btn hidden" id="right-btn"></button>
    </div>
  </div>
  <div id="content"></div>
  <div class="bnav" id="bnav">
    <button class="bnav-btn" data-tab="customers" onclick="switchTab('customers')"><span class="ico">👥</span><span class="lbl">לקוחות</span></button>
    <button class="bnav-btn" data-tab="invoices"  onclick="switchTab('invoices')"><span class="ico">📄</span><span class="lbl">חשבוניות</span></button>
    <button class="bnav-btn" data-tab="receipts"  onclick="switchTab('receipts')"><span class="ico">🧾</span><span class="lbl">קבלות</span></button>
    <button class="bnav-btn" data-tab="tax"       onclick="switchTab('tax')"><span class="ico">📋</span><span class="lbl">חשמ"ק</span></button>
  </div>
</div>
<script>
// ── Config ──
const STORAGE_KEY='moov_url_v6';
const VAT=0.18;

// ─────────────────────────────────────────────────────────
// ⚙️ CENTRAL MAPPING (CONFIG) ⚙️
// ─────────────────────────────────────────────────────────
const COLS = {
  // -- 1. Shared Invoices & Tax (חשבוניות / חשמ"ק) --
  docCustId: 'A',      // ת"ז / ח"פ
  docCustName: 'B',    // שם העסק
  docDate: 'C',        // תאריך
  
  price: 'AD',         // מחיר ליחידה
  subtotal: 'AE',      // סה"כ לפני מע"מ
  discount: 'AF',      // הנחה
  afterDisc: 'AG',     // סה"כ אחר הנחה
  
  // -- 2. Invoices Specific (חשבוניות) --
  invTerms: 'AH',      // תנאי תשלום
  invTotalVat: 'AI',   // סה"כ כולל מע"מ
  invNum: 'AJ',        // מספר חשבונית
  invPayType: 'AK',    // סוג תשלום
  invPayAmt: 'AL',     // סכום התשלום
  invPayDate: 'AM',    // תאריך פרעון שיק
  invChkNum: 'AN',     // מספר שיק
  invNotes: 'AO',      // הערות
  
  // -- 3. Tax Specific (חשבוניות/קבלות) --
  taxTotalVat: 'AH',   // סה"כ כולל מע"מ
  taxPayType: 'AI',    // סוג תשלום
  taxPayAmt: 'AJ',     // סכום התשלום
  taxPayDate: 'AK',    // תאריך פרעון שיק
  taxChkNum: 'AL',     // מספר שיק
  taxPhoto: 'AM',      // צילום שיק
  taxNotes: 'AN',      // הערות
  taxNum: 'AO',        // מספר חשבונית מס / קבלה

  // -- 4. Receipts (קבלות) --
  recInvNum: 'A',      // מספר חשבונית
  recPayType: 'B',     // סוג תשלום
  recPayAmt: 'C',      // סכום התשלום
  recPayDate: 'D',     // תאריך
  recChkNum: 'E',      // מספר שיק
  recPhoto: 'F',       // צילום שיק
  recNotes: 'G',       // הערות
  recCustName: 'H',    // לקוח
  recCustId: 'I',      // ת"ז/ח"פ
  recNum: 'J',         // מס קבלה

  // -- 5. Customers (לקוחות) --
  custName: 'A',       
  custId: 'B',         
  custBiz: 'C',        
  custPhone: 'D',      
  custEmail: 'E',      
  custStreet: 'F',     
  custCity: 'G',       
  custTerms: 'H',      // תנאי תשלום (Column H)
  custBankName: 'I',   
  custBankBranch: 'J', 
  custBankAcct: 'K',   // מספר חשבון (Column K)
  custBankHolder: 'L', // שם בעל החשבון (Column L)
  custNotes: 'M'       // הערות לקוח (Column M)
};
// ─────────────────────────────────────────────────────────

const TABS={
  customers:{label:'לקוחות',         color:'#1a73e8',bg:'#e8f0fe'},
  invoices: {label:'חשבוניות',        color:'#d67000',bg:'#fff3e0'},
  receipts: {label:'קבלות',           color:'#1e8e3e',bg:'#e6f4ea'},
  tax:      {label:'חשבוניות/קבלות', color:'#7b1fa2',bg:'#f3e5f5'},
};
const SHEETS={customers:'לקוחות',invoices:'חשבוניות',receipts:'קבלות',tax:'חשבוניות/קבלות'};
const PAYMENT_TYPES=['מזומן','שיק'];

const CF=[
  {k:COLS.custName,label:'שם לקוח',      mode:'text',req:true},
  {k:COLS.custId,label:'ת"ז / ח"פ',   mode:'num', copy:true},
  {k:COLS.custBiz,label:'שם העסק',       mode:'text'},
  {k:COLS.custPhone,label:'טלפון',         mode:'tel'},
  {k:COLS.custEmail,label:'כתובת מייל',    mode:'email'},
  {k:COLS.custStreet,label:'רחוב ומספר',    mode:'text'},
  {k:COLS.custCity,label:'עיר',           mode:'text'},
  {k:COLS.custTerms,label:'תנאי תשלום',    mode:'select', options: ['מזומן', 'שוטף', 'שוטף 15', 'שוטף 30', 'שוטף 45', 'שוטף 60', 'שוטף 90', 'שוטף 120', 'מזומן כנגד חשבונית']},

// ── Smart State Evaluators ──
function _isFieldEmpty(val) {
  const s = (val || '').toString().trim();
  return s === '' || s === '0' || s === '0.00' || s === '0.0';
}

function _cleanDateStr(rawDate) {
  if (!rawDate) return '';
  let s = String(rawDate).trim().replace(/\s+/g, '');
  let mISO = s.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
  if (mISO) {
    return mISO[3].padStart(2, '0') + '/' + mISO[2].padStart(2, '0') + '/' + mISO[1];
  }
  let mNormal = s.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})$/);
  if (mNormal) {
    let yr = mNormal[3].length === 2 ? '20' + mNormal[3] : mNormal[3];
    return mNormal[1].padStart(2, '0') + '/' + mNormal[2].padStart(2, '0') + '/' + yr;
  }
  return rawDate;
}

function setElValue(id, val) { const el = document.getElementById(id); if (el) el.value = val; }
function setElDisplay(id, v) { const el = document.getElementById(id); if (el) el.style.display = v; }
function setElText(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; }

function showToast(msg, type, duration) {
  const c = document.getElementById('toast-container');
  if (!c) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), duration || 3000);
}

function taxFormErrors() {
  const f = S.iForm;
  const calc = calcInv(f);
  const total = calc.withVat;
  const paid = parseFloat(f[COLS.taxPayAmt] || 0);
  const isOver = f[COLS.taxPayType] === 'שיק' && total > 0 && paid > total + 0.5;
  if (!f[COLS.docCustId]?.trim()) return 'ת"ז / ח"פ הוא שדה חובה';
  if (!f[COLS.taxPayType]) return 'בחר סוג תשלום';
  if (!f[COLS.taxPayAmt]?.trim()) return 'הזן סכום תשלום';
  if (f[COLS.taxPayType] !== 'שיק' && total > 0 && paid > total + 0.5)
    return `רק שיק מאפשר תשלום גבוה מהחשבונית (₪${Math.round(total).toLocaleString('he-IL')})`;
  if (isOver && !f._overInvNum?.trim()) {
    const excess = Math.round((paid - total) * 100) / 100;
    const hasMatch = (f._openInvs || []).some(inv => {
      const n = nz(inv[COLS.invNum]) || nz(inv[COLS.taxNum]) || '';
      return n && Math.abs(getInvBalance(n) - excess) <= 0.5;
    });
    return hasMatch
      ? 'בחר חשבונית עבור ההפרש מהרשימה'
      : `אין חשבונית פתוחה עם יתרה ₪${Math.round(excess).toLocaleString('he-IL')}`;
  }
  if (f[COLS.taxPayType] === 'שיק') {
    if (!f[COLS.taxChkNum]?.trim()) return 'הזן מספר שיק';
    if (!f[COLS.taxPayDate]?.trim()) return 'הזן תאריך פרעון שיק';
    if (!f._photoTaken) return 'צלם את השיק';
  }
  return null;
}

function invoiceFormErrors() {
  const f = S.iForm;
  const calc = calcInv(f);
  if (!f[COLS.docCustId]?.trim()) return 'ת"ז / ח"פ הוא שדה חובה';
  if (calc.totalQty <= 0) return 'חובה לבחור לפחות מוצר אחד';
  if (!f[COLS.price]?.trim() || parseFloat(f[COLS.price]) <= 0) return 'חובה להזין מחיר ליחידה תקין';
  return null;
}

function receiptFormErrors() {
  const rf = S.rForm;
  if (!rf[COLS.recPayType]) return 'בחר סוג תשלום';
  if (!rf[COLS.recPayAmt]?.trim()) return 'הזן סכום תשלום';
  const paid = parseFloat(rf[COLS.recPayAmt]) || 0;
  const balance = parseFloat(rf._invTotal) || 0;
  if (rf[COLS.recPayType] !== 'שיק' && balance > 0 && paid > balance + 0.5)
    return 'רק שיק מאפשר תשלום גבוה מהיתרה (₪' + Math.round(balance).toLocaleString('he-IL') + ')';
  if (rf[COLS.recPayType] === 'שיק' && balance > 0 && paid > balance + 0.5 && !rf._overInvNum?.trim()) {
    const excess = Math.round((paid - balance) * 100) / 100;
    const inv1   = rf[COLS.recInvNum];
    const hasMatch = (rf._custOpenInvs || []).some(inv => {
      const n = nz(inv[COLS.invNum]) || nz(inv[COLS.taxNum]) || '';
      return n && n !== inv1 && Math.abs(getInvBalance(n) - excess) <= 0.5;
    });
    return hasMatch
      ? 'בחר חשבונית עבור ההפרש מהרשימה'
      : `אין חשבונית פתוחה עם יתרה ₪${Math.round(excess).toLocaleString('he-IL')}`;
  }

  const recInvNumStr = String(rf[COLS.recInvNum] || '').trim();
  if (recInvNumStr && (S.isState === 'ok' || S.tsState === 'ok')) {
    const inInv = S.isState === 'ok' && S.invoices.find(r =>
      nz(r[COLS.invNum]) && String(r[COLS.invNum]).trim() === recInvNumStr);
    const inTax = S.tsState === 'ok' && S.tax.find(r =>
      nz(r[COLS.taxNum]) && String(r[COLS.taxNum]).trim() === recInvNumStr);
    if (!inInv && !inTax) return 'מספר חשבונית לא קיים במערכת';
  }
  if (rf[COLS.recPayType] === 'שיק') {
    if (!rf[COLS.recChkNum]?.trim()) return 'הזן מספר שיק';
    if (!rf[COLS.recPayDate]?.trim()) return 'הזן תאריך פרעון שיק';
    if (!rf._photoTaken) return 'צלם את השיק';
  }
  return null;
}

function tod() {
  const d = new Date();
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}
function dateToISO(s) {
  if (!s) return new Date().toISOString().slice(0, 10);
  const p = s.split('/');
  if (p.length === 3) return p[2] + '-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0');
  return new Date().toISOString().slice(0, 10);
}
function isoToHeb(s) {
  if (!s) return '';
  const p = s.split('-');
  if (p.length === 3) return p[2] + '/' + p[1] + '/' + p[0];
  return s;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nz(x) { return x && x !== '0' && x !== '0.00' ? x : ''; }
function fmt(x) {
  const n = parseFloat((x || '').toString().replace(/[^0-9.]/g, ''));
  if (isNaN(n) || n === 0) return x || '';
  return '₪' + n.toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtNum(n) { return n.toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtPhone(x) {
  if (!x) return x;
  const d = x.replace(/\D/g, '');
  if (d.length === 10 && d.startsWith('0')) return d.slice(0, 3) + '-' + d.slice(3);
  if (d.length === 9 && d.startsWith('0')) return d.slice(0, 2) + '-' + d.slice(2);
  return x;
}
function isBusy(e) { const m = (e?.message || '').toLowerCase(); return m.includes('quota') || m.includes('rate') || m.includes('limit') || m.includes('429'); }
function rowBg(r, isExp) {
  if (isExp) return '#ffffff';
  const bg = (r._bg || '#ffffff').toLowerCase().replace(/\s/g, '');
  return (bg === '#ffffff' || bg === '#fff' || bg === 'white' || bg === '') ? '#ffffff' : r._bg;
}
function isOrangeBg(rawBg) {
  if (!rawBg) return false;
  const b = rawBg.toLowerCase().replace(/\s/g, '');
  if (b === '#ffffff' || b === '#fff' || b === 'white' || b === '') return false;
  const m = b.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/);
  if (!m) return false;
  const r = parseInt(m[1], 16), g = parseInt(m[2], 16), bl = parseInt(m[3], 16);
  return r > 140 && g > 60 && bl < 100 && r > g + 20 && r > bl + 80;
}
function calcInv(f) {
  const price = parseFloat(f[COLS.price]) || 0;
  const totalQty = PRODS.reduce((s, p) => s + (parseInt(f[p.qk]) || 0), 0);
  const aa = price * totalQty;
  const disc = parseFloat(f[COLS.discount]) || 0;
  const ac = aa * (1 - disc / 100);
  const withVat = ac * (1 + VAT);
  return { totalQty, aa, disc, ac, withVat };
}

// ── API ──
async function apiFetch(params) {
  if (!S.scriptUrl) throw new Error('NO_URL');
  const base = S.scriptUrl.trim();
  const r = await fetch(base + '?' + new URLSearchParams(params));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error + ((d.available && Array.isArray(d.available)) ? ' | ' + d.available.join(', ') : ''));
  return d;
}

async function apiPost(body) {
  if (!S.scriptUrl) return { status: 'ok' };
  const sendBodyFull = Object.assign({}, body);                     
  const sendBodyNoPhoto = Object.assign({}, body);
  delete sendBodyNoPhoto.photoBase64;
  const hasPhoto = !!(body.photoBase64);
  const base = S.scriptUrl.trim();
  const bodyStrFull    = JSON.stringify(sendBodyFull);
  const bodyStrNoPhoto = JSON.stringify(sendBodyNoPhoto);
  const sep    = base.includes('?') ? '&' : '?';
  const getUrl = base + sep + 'write=1&payload=' + encodeURIComponent(bodyStrNoPhoto);
  const t = new Date().toLocaleTimeString('he-IL');
  S._lastSave = { t, bodyLen: bodyStrFull.length, phase: '?', resp: '', payloadPreview: bodyStrNoPhoto.slice(0, 200) };

  try {
    const r = await fetch(base, {
      method: 'POST',
      body: bodyStrFull,
      headers: { 'Content-Type': 'text/plain' },
      redirect: 'manual'
    });
    if (r.type === 'opaqueredirect' || r.status === 0) {
      S._lastSave.phase = '1-sent';
      S._lastSave.resp  = 'opaque-redirect (write+photo likely ok)';
      return { status: 'ok', unconfirmed: true };
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d && d.error) throw new Error(d.error);
    S._lastSave.phase = '1-ok';
    S._lastSave.resp  = JSON.stringify(d).slice(0, 120);
    return d;
  } catch(fetchErr) {
    S._lastSave.p1err = fetchErr.message;
    if (fetchErr.message !== 'Failed to fetch') {
      S._lastSave.phase = '1-err';
      throw fetchErr;
    }
  }

  console.warn('apiPost: network error → iframe fallback' + (hasPhoto ? ' (photo dropped)' : ''));
  await new Promise(resolve => {
    const ifr = document.createElement('iframe');
    ifr.style.cssText = 'display:none;width:0;height:0;position:absolute;left:-9999px;';
    document.body.appendChild(ifr);
    ifr.src = getUrl;
    setTimeout(() => {
      try { document.body.removeChild(ifr); } catch(_) {}
      resolve();
    }, 4000);
  });
  S._lastSave.phase = '2-iframe-ok';
  S._lastSave.resp  = hasPhoto ? 'nav — photo skipped (network err)' : 'nav (cannot read GAS response)';
  return { status: 'ok', photoSkipped: hasPhoto };
}

async function pingSheets() {
  try {

    if (d.sheets) {
      S.availableSheets = d.sheets;
      d.sheets.forEach(n => {

        n = n.toString().trim();
        if (n === 'לקוחות') SHEETS.customers = n;
        else if (n.includes('/')) SHEETS.tax = n;
        else if (/^חשבוניות$/.test(n)) SHEETS.invoices = n;
        else if (/^קבלות$/.test(n)) SHEETS.receipts = n;
      });
    }
  } catch (e) { console.error('ping', e); }
}

async function loadAny(tab, stateKey, limit, req) {
  S[stateKey] = 'loading'; render();
  try {
    const p = { sheet: SHEETS[tab] };
    if (limit) p.limit = limit;
    if (req) p.require = req;
    const d = await apiFetch(p);
    S[tab] = (d.data || []).map((r, i) => ({ ...r, _id: i, _row: r._rowIndex ? parseInt(r._rowIndex) : (i + 2) })); 
    
    if (tab === 'customers' && d.termsOptions && d.termsOptions.length) {
      const termsField = CF.find(f => f.k === COLS.custTerms);
      if (termsField) {
        termsField.options = d.termsOptions;
      }
    }
    
    S[stateKey] = 'ok'; delete S.errors[tab];
  } catch (e) {
    S[stateKey] = isBusy(e) ? 'busy' : 'error';
    S.errors[tab] = e.message;
  }
  render();
}

function getInvBalance(invNum) {
  if (!invNum) return 0;
  const inv = S.invoices.find(r => nz(r[COLS.invNum]) === invNum)

    .filter(r => nz(r[COLS.recInvNum]) === invNum)

  return Math.max(0, total - paid);

function buildTaxOpenInvsHtml() {
  const f = S.iForm;
  if (!f._openInvs || !f._openInvs.length) return '';
  const paid  = parseFloat(f[COLS.taxPayAmt] || 0);
  const total = calcInv(f).withVat;
  const isOver = f[COLS.taxPayType] === 'שיק' && paid > total + 0.5;
  if (!isOver) return '';
  const excess = Math.round((paid - total) * 100) / 100;
  
  const matching = f._openInvs.filter(inv => {
    const n = nz(inv[COLS.invNum]) || nz(inv[COLS.taxNum]) || '';
    if (!n) return false;
    return Math.abs(getInvBalance(n) - excess) <= 0.5;
  });
  if (!matching.length) {
    return `<div style="background:#fff3e0;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#e65100">
      ⚠️ אין חשבוניות פתוחות עם יתרה של ₪${Math.round(excess).toLocaleString('he-IL')} — שנה את סכום השיק
    </div>`;
  }
  let h = `<div class="dtable" style="margin-bottom:12px">
    <div class="dthead" style="background:${tc()}"><span>חשבונית לכיסוי ההפרש</span><span style="font-weight:700">₪${Math.round(excess).toLocaleString('he-IL')}</span></div>`;
  matching.forEach((inv, i) => {
    const invNum  = nz(inv[COLS.invNum]) || nz(inv[COLS.taxNum]) || '—';
    const invDate = nz(inv[COLS.docDate]) || '';
    const balance = getInvBalance(invNum);
    const selected = f._overInvNum === invNum;
    h += `<div class="dtrow" style="cursor:pointer;${selected ? `background:${tc()}15;` : ''}${i === 0 ? 'border-top:none' : ''}"
      onclick="setTaxOverInv('${esc(invNum)}')">
      <div>
        <div style="font-size:13px;font-weight:600;color:${selected ? tc() : '#222'}">#${esc(invNum)}</div>

function buildOpenInvsHtml() {
  const rf = S.rForm;
  if (!rf._openInvs || !rf._openInvs.length) return '';
  let h = '<div class="fdivider"><hr><span>📄 חשבוניות פתוחות</span><hr></div>' +
          '<div class="dtable" style="margin-bottom:12px">' +
          '<div class="dthead" style="background:' + tc() + '"><span>בחר חשבונית לתשלום</span><span>' + rf._openInvs.length + ' פתוחות</span></div>';
  rf._openInvs.forEach((inv, i) => {
    const invNum = nz(inv[COLS.invNum]) || nz(inv[COLS.taxNum]) || '—';
    const invDate = nz(inv[COLS.docDate]) || '';
    const balance = getInvBalance(invNum);
    const rawTotal = parseFloat(nz(inv[COLS.invTotalVat])) || 0;
    const hasPartial = balance < rawTotal - 0.1;
    const selected = rf[COLS.recInvNum] === invNum;
    
    h += '<div class="dtrow" style="cursor:pointer;' + (selected ? 'background:' + tc() + '15;' : '') + (i === 0 ? 'border-top:none;' : '') + '" ' +
         'onclick="pickReceiptInv(\'' + esc(invNum) + '\',\'' + balance + '\',\'' + esc(invDate) + '\')">' +
         '<div>' +
           '<div style="font-size:13px;font-weight:600;color:' + (selected ? tc() : '#222') + '">#' + esc(invNum) + '</div>' +
           '<div style="font-size:11px;color:#888">' + esc(invDate) + '</div>' +
           (hasPartial ? '<div style="font-size:10px;color:#e65100">שולם חלקית: ₪' + Math.round(rawTotal - balance).toLocaleString('he-IL') + '</div>' : '') +
         '</div>' +
         '<div style="text-align:left">' +
           '<div style="font-size:14px;font-weight:700;color:' + tc() + '">יתרה: ' + fmt(String(balance)) + '</div>' +
           (selected ? '<div style="font-size:10px;color:' + tc() + '">✓ נבחרה</div>' : '') +
         '</div>' +
      '</div>';
  });
  h += '</div>';
  return h;
}

function renderOpenInvs() {
  const container = document.getElementById('open-invs-container');
  if (container) container.innerHTML = buildOpenInvsHtml();
}

function captureReceiptFields() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  S.rForm[COLS.recPayAmt] = g('r-' + COLS.recPayAmt).trim();
  S.rForm[COLS.recInvNum] = g('r-' + COLS.recInvNum).trim() || S.rForm[COLS.recInvNum];  
  S.rForm[COLS.recChkNum] = g('r-' + COLS.recChkNum).trim();
  S.rForm[COLS.recPayDate] = g('r-' + COLS.recPayDate).trim() || S.rForm[COLS.recPayDate];
  
  const rh = g('r-H'); if (rh) S.rForm._custName = rh;
  const ri = g('r-I'); if (ri) S.rForm._custId = ri;
  
  const rcn = g('r-custNotes'); if (rcn !== undefined) S.rForm[COLS.custNotes] = rcn;
  
  const gEl = document.getElementById('r-' + COLS.recNotes); if (gEl) S.rForm[COLS.recNotes] = gEl.value;
}

function onReceiptPayTypeChange(val) {
  captureReceiptFields();
  S.rForm[COLS.recPayType] = val;
  render();
}

function clearReceiptCustomer() {
  S.rForm._custName = ''; S.rForm._custId = ''; S.rForm._openInvs = []; S.rForm._custOpenInvs = [];
  S.rForm[COLS.recInvNum] = ''; S.rForm._invTotal = ''; S.rForm._invDate = ''; S.rForm._overInvNum = '';
  setElValue('r-H', '');
  setElValue('r-I', '');
  setElValue('r-custNotes', '');
  setElValue('r-' + COLS.recInvNum, '');
  setElDisplay('receipt-inv-total', 'none');
  renderOpenInvs();
  renderSaveBtnRec();
}

function onReceiptInvNumInput(val) {
  S.rForm[COLS.recInvNum] = val;
  renderSaveBtnRec();
  clearTimeout(_invLookupTimer);
  
  if (!val.trim()) {
    S.rForm._invTotal = '';
    S.rForm._invDate = '';
    setElDisplay('receipt-inv-total', 'none');
    return;
  }
  
  _invLookupTimer = setTimeout(() => {
    const found = S.invoices.find(r => nz(r[COLS.invNum]) && String(r[COLS.invNum]).trim() === val.trim())
      || S.tax.find(r => nz(r[COLS.taxNum]) && String(r[COLS.taxNum]).trim() === val.trim());
    
    if (found) {
      S.rForm._custId = nz(found[COLS.docCustId]) || '';
      let cName = nz(found[COLS.docCustName]);
      if (!cName && S.rForm._custId) {
        const cust = S.customers.find(c => c[COLS.custId] === S.rForm._custId);
        if (cust) cName = cust[COLS.custBiz] || cust[COLS.custName];
      }
      S.rForm._custName = cName || '';
      S.rForm._invTotal = String(getInvBalance(val.trim()));
      S.rForm._invDate = nz(found[COLS.docDate]) || '';
      if (!S.rForm._custOpenInvs?.length) S.rForm._custOpenInvs = openInvsFor(S.rForm._custId);

      const cust = S.customers.find(c => c[COLS.custId] === S.rForm._custId);
      S.rForm[COLS.custNotes] = cust ? cust[COLS.custNotes] : '';
      S.rForm._custEditRow = cust ? cust._row : null;
      S.rForm._custEditId = cust ? cust._id : null;
      setElValue('r-custNotes', S.rForm[COLS.custNotes]);
      
      setElValue('r-H', S.rForm._custName);
      setElValue('r-I', S.rForm._custId);
      setElValue('r-custNotes', S.rForm[COLS.custNotes]);

      if (S.rForm._invTotal) {
        setElDisplay('receipt-inv-total', 'flex');
        setElText('rcb-total-val', fmt(S.rForm._invTotal));
      }
    } else {
      S.rForm._invTotal = '';
      S.rForm._invDate = '';
      setElDisplay('receipt-inv-total', 'none');
    }
    renderOpenInvs();
    renderSaveBtnRec();
  }, 400);
}

function buildOverInvPickerHtml() {
  const rf = S.rForm;
  const paid  = parseFloat(rf[COLS.recPayAmt]) || 0;
  const total = parseFloat(rf._invTotal) || 0;
  if (rf[COLS.recPayType] !== 'שיק' || total <= 0 || paid <= total + 0.5) return '';

  const excess = Math.round((paid - total) * 100) / 100;
  const inv1   = rf[COLS.recInvNum];
  const others = (rf._custOpenInvs || []).filter(inv => {
    const n = nz(inv[COLS.invNum]) || nz(inv[COLS.taxNum]) || '';
    if (!n || n === inv1) return false;
    return Math.abs(getInvBalance(n) - excess) <= 0.5;
  });

  let h = `<div style="background:#fff8e1;border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:13px;color:#e65100">` +
    `⚠️ שיק ₪${Math.round(paid).toLocaleString('he-IL')} — ₪${Math.round(total).toLocaleString('he-IL')} לחשבונית זו | יתרה ₪${Math.round(excess).toLocaleString('he-IL')}` +
  `</div>`;

  if (others.length) {
    h += '<div class="dtable" style="margin-bottom:8px">' +
         '<div class="dthead" style="background:' + tc() + '"><span>חשבונית לכיסוי יתרת השיק</span>' +
         '<span style="font-weight:700">₪' + Math.round(excess).toLocaleString('he-IL') + '</span></div>';
    others.forEach((inv, i) => {
      const invNum    = nz(inv[COLS.invNum]) || nz(inv[COLS.taxNum]) || '—';
      const invDate   = nz(inv[COLS.docDate]) || '';
      const invBal    = getInvBalance(invNum);
      const rawTotal  = parseMoney(nz(inv[COLS.invTotalVat]) || nz(inv[COLS.taxTotalVat])) || 0;
      const hasPartial = rawTotal > 0 && invBal < rawTotal - 0.1;
      const selected  = rf._overInvNum === invNum;
      h += '<div class="dtrow" style="cursor:pointer;' + (selected ? 'background:' + tc() + '15;' : '') +
           (i === 0 ? 'border-top:none;' : '') + '" onclick="pickOverReceiptInv(\'' + esc(invNum) + '\',\'' + invBal + '\')">' +
           '<div>' +
             '<div style="font-size:13px;font-weight:600;color:' + (selected ? tc() : '#222') + '">#' + esc(invNum) + '</div>' +
             '<div style="font-size:11px;color:#888">' + esc(invDate) + '</div>' +
             (hasPartial ? '<div style="font-size:10px;color:#e65100">שולם חלקית: ₪' + Math.round(rawTotal - invBal).toLocaleString('he-IL') + '</div>' : '') +
           '</div>' +
           '<div style="text-align:left">' +
             '<div style="font-size:14px;font-weight:700;color:' + tc() + '">יתרה: ' + fmt(String(invBal)) + '</div>' +
             (selected ? '<div style="font-size:10px;color:' + tc() + '">✓ נבחרה</div>' : '') +
           '</div></div>';
    });
    h += '</div>';
  } else {
    h += `<div style="background:#fce4e4;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;color:#c62828;font-weight:600">` +
         `⛔ אין חשבוניות פתוחות עם יתרה של ₪${Math.round(excess).toLocaleString('he-IL')} — שנה את סכום השיק` +
         `</div>`;
  }

  if (rf._overInvNum) {
    h += `<div style="background:${tc()}15;border-radius:8px;padding:8px 12px;margin-bottom:4px;font-size:12px;color:${tc()};font-weight:600">✓ נבחרה חשבונית #${esc(rf._overInvNum)}</div>`;
  }

  return h;
}

// ── Gemini Vision OCR for cheques ──
function _ocrCanvas(img) {
  const OCR_MAX = 1600;
  const r = Math.min(OCR_MAX / img.width, OCR_MAX / img.height, 1);
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.92).split(',')[1];
}

function _ocrNormalise(result) {
  if (!result) return result;
  if (result.amount)    result.amount    = String(result.amount).replace(/[^\d.]/g, '');
  if (result.chequeNum) result.chequeNum = String(result.chequeNum).replace(/\D/g, '');
  if (result.date)      result.date      = _cleanDateStr(result.date);
  return result;
}

const OCR_PROMPT = `This is an Israeli bank cheque (שיק). Extract three values:
1. chequeNum – cheque number from the MICR line at the bottom. Israeli cheques are RTL: cheque number is on the RIGHT of the MICR line, account number in the middle, bank/branch on the LEFT. Return digits only.
2. amount – payment amount, digits and decimal point only (no ₪, no commas).
3. date – due date (תאריך פירעון) in DD/MM/YYYY format, or "" if unclear.
Reply ONLY with JSON: {"chequeNum":"...","amount":"...","date":"..."}`;

function _parseCheckText(text) {
  const result = { chequeNum: '', amount: '', date: '' };
  console.log('[OCR raw]', text);

  // 1. CHEQUE NUMBER EXTRACTOR
  const chqLabel = text.match(/(?:CHEQUE\s*N[o0O]\.?\s*|מספר\s*שיק\s*[:\-]?\s*)(\d{4,10})/i);
  if (chqLabel) {
    result.chequeNum = chqLabel[1];
  } else {
    const firstBlock = text.slice(0, Math.min(text.length, 400));
    const early = firstBlock.match(/\b(\d{4,8})\b/g) || [];
    if (early.length) result.chequeNum = early[0];
  }

  // 2. DATE EXTRACTOR - Whitespace insulated and punctuation safe
  const dm = text.match(/(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{2,4})/);
  if (dm) {
    const yr = dm[3].trim().length === 2 ? '20' + dm[3].trim() : dm[3].trim();
    result.date = dm[1].trim().padStart(2,'0') + '/' + dm[2].trim().padStart(2,'0') + '/' + yr;
  }

  // 3. SCORING AMOUNT EXTRACTOR
  const stripped = text.replace(/\b\d{6,}\b/g, ' '); 
  const dateDigits = new Set((result.date || '').split('/').filter(Boolean));
  
  const amtCandidates = [...stripped.matchAll(/\b(\d{1,5}(?:[.,]\d{1,2})?)\b/g)]
    .map(m => {
      const strVal = m[1].replace(',', '.');
      const val = parseFloat(strVal);
      
      const startIdx = Math.max(0, m.index - 15);
      const endIdx = Math.min(stripped.length, m.index + m[0].length + 15);
      const context = stripped.slice(startIdx, endIdx);
      
      let score = 0;
      if (context.includes('#')) score += 100; 
      if (context.includes('₪') || context.includes('סכום')) score += 50;
      if (val === 20 || val === 26 || val === 522) score -= 40; 
      
      return { str: strVal, val: val, score: score };
    })
    .filter(m => m.val >= 5 && m.val < 100000 && !dateDigits.has(m.str.split('.')[0]));

  if (amtCandidates.length) {
    amtCandidates.sort((a, b) => b.score - a.score || b.val - a.val);
    result.amount = amtCandidates[0].str.replace(/\.00$/, '');
  }

  return result;
}

async function _ocrOcrSpace(img) {
  const b64 = 'data:image/jpeg;base64,' + _ocrCanvas(img);
  const fd  = new FormData();
  fd.append('base64Image', b64);
  fd.append('language', 'eng');           
  fd.append('OCREngine', '2');            
  fd.append('detectOrientation', 'true');
  fd.append('scale', 'true');
  const res = await fetch('https://api.ocr.space/parse/image', {
    method: 'POST',
    headers: { 'apikey': S.ocrSpaceKey },
    body: fd
  });
  if (!res.ok) throw new Error(`OCR.space HTTP ${res.status}`);
  const d = await res.json();
  if (d.IsErroredOnProcessing) throw new Error((d.ErrorMessage || ['OCR.space error'])[0]);
  const text = (d.ParsedResults || [])[0]?.ParsedText || '';
  if (!text.trim()) throw new Error('OCR returned empty text');
  return _parseCheckText(text);
}

async function extractCheckOCR(img) {
  if (S.ocrSpaceKey)  return _ocrOcrSpace(img);
  if (S.anthropicKey) return _ocrAnthropic(img);
  if (S.geminiKey)    return _ocrGemini(img);
  return null;
}

async function _ocrAnthropic(img) {
  const body = {
    model: 'claude-3-5-haiku-20241022',
    max_tokens: 150,
    messages: [{ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: _ocrCanvas(img) } },
      { type: 'text',  text: OCR_PROMPT }
    ]}]
  };
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': S.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message || `Claude error ${res.status}`);
  const text = (d.content?.[0]?.text || '').trim()
    .replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/,'').trim();
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON from Claude');
  return _ocrNormalise(JSON.parse(m[0]));
}

async function _ocrGemini(img) {
  const body = {
    contents: [{ parts: [
      { text: OCR_PROMPT },
      { inline_data: { mime_type: 'image/jpeg', data: _ocrCanvas(img) } }
    ]}],
    generationConfig: { temperature: 0, maxOutputTokens: 150 }
  };
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${S.geminiModel}:generateContent?key=${S.geminiKey}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const d = await res.json();
  if (d.error) throw new Error(d.error.message || `Gemini error ${res.status}`);
  const text = (d.candidates?.[0]?.content?.parts?.[0]?.text || '').trim()
    .replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/,'').trim();
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON from Gemini');
  return _ocrNormalise(JSON.parse(m[0]));
}

function _compressPhoto(img, maxPx, quality) {
  const ratio = Math.min(maxPx / img.width, maxPx / img.height, 1);
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * ratio); c.height = Math.round(img.height * ratio);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}

function _applyOcrToForm(result, form, numKey, amtKey, dateKey) {
  if (!result) return false;
  let changed = false;
  
  if (result.chequeNum && _isFieldEmpty(form[numKey])) { form[numKey]  = result.chequeNum; changed = true; }
  if (result.amount    && _isFieldEmpty(form[amtKey])) { form[amtKey]  = result.amount;    changed = true; }
  if (result.date)                                     { form[dateKey] = result.date;      changed = true; }
  
  return changed;
}

function onPhotoChange(input) {
  if (!input.files || !input.files[0]) return;
  showToast('⏳ מעבד תמונה...', 'ok', 2000);
  const img = new Image();
  img.onload = function() {
    URL.revokeObjectURL(img.src);
    const b64 = _compressPhoto(img, 1200, 0.85);
    S.iForm._photoDataUrl = b64;
    S.iForm._photoBase64 = b64;
    S.iForm._photoTaken = true;
    render();
    setTimeout(() => {
      document.querySelector('img[src^="data:image"]')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
    if (S.ocrSpaceKey || S.anthropicKey || S.geminiKey) {
      showToast('🔍 מזהה פרטי שיק...', 'ok', 4000);
      extractCheckOCR(img)
        .then(result => {
          const changed = _applyOcrToForm(result, S.iForm, COLS.taxChkNum, COLS.taxPayAmt, COLS.taxPayDate);
          if (changed) { render(); showToast('✅ פרטי שיק זוהו אוטומטית', 'ok', 4000); }
          else showToast('⚠️ לא זוהו פרטי שיק — מלא ידנית', 'err', 3500);
        })
        .catch(e => showToast('⚠️ שגיאת OCR: ' + (e.message || 'נסה שוב'), 'err', 5000));
    }
  };
  img.onerror = function() { showToast('❌ שגיאה בטעינת התמונה', 'err'); };
  img.src = URL.createObjectURL(input.files[0]);
  input.value = '';
}

  S.iForm[COLS.docCustId] = custId;
  S.iForm[COLS.docCustName] = bizName || ''; 
  S.iForm._openInvs = openInvsFor(custId);
  
  const cust = S.customers.find(c => c[COLS.custId] === custId);
  S.iForm[COLS.custNotes] = cust ? cust[COLS.custNotes] : '';
  S.iForm[COLS.invTerms] = cust ? cust[COLS.custTerms] : '';
  S.iForm._custEditRow = cust ? cust._row : null;
  S.iForm._custEditId = cust ? cust._id : null;
  
  S.showSuggest = false; S.suggest = [];
  const inp = document.getElementById('inv-custName');
  if (inp) inp.value = bizName || '';
  const idField = document.getElementById('inv-custId');
  if (idField) idField.value = custId || '';
  
  const notesField = document.getElementById('inv-custNotes');
  if (notesField) notesField.value = S.iForm[COLS.custNotes];
  
  const termsField = document.getElementById('inv-custTerms');
  if (termsField) termsField.value = S.iForm[COLS.invTerms];
  
  document.getElementById('suggest-box')?.remove();
  renderTaxOpenInvs();
  renderSaveBtn();
}

function editCust(custId) {
  const c = S.customers.find(x => x._id === custId);
  if (!c) return;
  const form = {};
  CF.forEach(f => { form[f.k] = c[f.k] || ''; });
  S.cForm = form;
  S.cForm._editId = custId;   
  S.cForm._editRow = c._row;  
  S.screen = 'new-customer'; S.msg = null;
  setHeader(); render();
}

async function updateCustomerNotesIfNeeded(custEditId, custEditRow, notesVal) {
  if (!custEditRow) return;
  const cust = S.customers.find(c => c._id === custEditId);
  if (!cust) return;
  if ((cust[COLS.custNotes] || '') !== (notesVal || '')) {
    const updatedData = {};
    CF.forEach(f => {
      updatedData[f.k] = cust[f.k] || ''; 
    });
    updatedData[COLS.custNotes] = notesVal || '';
    await apiPost({ action: 'updateCustomer', data: updatedData, editRow: custEditRow });
    cust[COLS.custNotes] = notesVal || '';
  }
}

async function saveCust() {
  if (!S.cForm[COLS.custName]?.trim()) {
    showToast('❌ שם לקוח הוא שדה חובה', 'err');
    return;
  }
  if (S.cForm[COLS.custPhone]) S.cForm[COLS.custPhone] = fmtPhone(S.cForm[COLS.custPhone]);
  
  const isEdit = (S.cForm._editId !== undefined && S.cForm._editId !== null);
  
  S.saving = true; S.msg = null; render();
  try {
    if (isEdit) {
      await apiPost({ action: 'updateCustomer', data: { ...S.cForm }, editRow: S.cForm._editRow });
      const idx = S.customers.findIndex(c => c._id === S.cForm._editId);
      if (idx >= 0) S.customers[idx] = { ...S.customers[idx], ...S.cForm };
    } else {
      await apiPost({ action: 'addCustomer', data: { ...S.cForm } });
      S.customers.push({ ...S.cForm, _id: S.customers.length, _bg: '#ffffff' });
    }
    S.msg = { t: 's', m: isEdit ? 'פרטי הלקוח עודכנו!' : 'הלקוח נשמר בהצלחה!' }; S.saving = false; render();
    setTimeout(() => { S.screen = 'list'; S.cForm = efC(); S.msg = null; setHeader(); render(); }, 1500);
  } catch (e) {
    showToast('❌ ' + (e.message || 'שגיאה'), 'err');
    S.saving = false;
    render();
  }
}

async function saveReceipt() {
  if (S.saving) return;
  captureReceiptFields();
  const err = receiptFormErrors();
  if (err) { showToast('❌ ' + err, 'err'); return; }

  const rf = S.rForm;
  const paid = parseFloat(rf[COLS.recPayAmt]) || 0;
  const balance = parseFloat(rf._invTotal) || 0;
  
  if (balance > 0.5 && paid < balance - 0.5) {
    const diff = Math.round(balance - paid).toLocaleString('he-IL');
    showConfirm('⚠️ תשלום חלקי', 'שולם: ₪' + Math.round(paid).toLocaleString('he-IL') + '\nיתרה: ₪' + Math.round(balance).toLocaleString('he-IL') + '\nנותר: ₪' + diff + '\n\nהאם ברצונך להמשיך בשמירת הקבלה?', function() {
      executeSaveReceipt();
    });
  } else {
    executeSaveReceipt();
  }
}

async function executeSaveReceipt() {
  const rf = S.rForm;
  const paid = parseFloat(rf[COLS.recPayAmt]) || 0;
  const balance = parseFloat(rf._invTotal) || 0;
  const isOverpay = rf[COLS.recPayType] === 'שיק' && balance > 0.5 && paid > balance + 0.5;
  const excess = isOverpay ? Math.round((paid - balance) * 100) / 100 : 0;
  const inv2 = rf._overInvNum?.trim() || '';

  const g1Notes = isOverpay
    ? `שיק ₪${Math.round(paid).toLocaleString('he-IL')} — שולם ₪${Math.round(balance).toLocaleString('he-IL')} לחשבונית זו | יתרה ₪${Math.round(excess).toLocaleString('he-IL')} לחשבונית מס׳ ${inv2 || '—'}${rf[COLS.recNotes]?.trim() ? ' | ' + rf[COLS.recNotes].trim() : ''}`
    : rf[COLS.recNotes] || '';
    
  const invNumRaw = (rf[COLS.recInvNum] || '').trim();
  const invNumVal = invNumRaw && /^\d+$/.test(invNumRaw) ? parseInt(invNumRaw, 10) : invNumRaw;

  const data1 = {
    [COLS.recInvNum]: invNumVal,
    [COLS.recPayType]: rf[COLS.recPayType] || '',
    [COLS.recPayAmt]: isOverpay ? Math.round(balance * 100) / 100 : parseFloat(rf[COLS.recPayAmt]) || 0,
    [COLS.recPayDate]: rf[COLS.recPayDate] || tod(),
    [COLS.recChkNum]: rf[COLS.recChkNum] || '',
    [COLS.recNotes]: g1Notes
  };

  S.saving = true;
  renderSaveBtnRec();
  try {
    const res1 = await apiPost({ action: 'addReceipt', data: data1, photoBase64: rf._photoDataUrl ? (rf._photoBase64 || '') : '' });
    const rowInfo = res1 && res1.savedRow ? ` (שורה ${res1.savedRow})` : '';
    const photoNote = res1 && res1.photoSkipped ? ' — 📷 תמונה לא נשמרה' : '';
    S.receipts.push({ ...data1, _id: S.receipts.length, _bg: '#ffffff' });

    if (isOverpay && inv2) {
      const g2Notes = `שיק ₪${Math.round(paid).toLocaleString('he-IL')} — יתרה ₪${Math.round(excess).toLocaleString('he-IL')} לחשבונית זו | ₪${Math.round(balance).toLocaleString('he-IL')} שולמו לחשבונית מס׳ ${rf[COLS.recInvNum] || '—'}`;
      const inv2Val = inv2 && /^\d+$/.test(inv2) ? parseInt(inv2, 10) : inv2;
      const data2 = {
        [COLS.recInvNum]: inv2Val,
        [COLS.recPayType]: rf[COLS.recPayType],
        [COLS.recPayAmt]: Math.round(excess * 100) / 100,
        [COLS.recPayDate]: rf[COLS.recPayDate] || tod(),
        [COLS.recChkNum]: rf[COLS.recChkNum] || '',
        [COLS.recNotes]: g2Notes
      };
      await apiPost({ action: 'addReceipt', data: data2, photoBase64: rf._photoDataUrl ? (rf._photoBase64 || '') : '' });
      S.receipts.push({ ...data2, _id: S.receipts.length, _bg: '#ffffff' });
    }

    if (rf._custEditRow && rf[COLS.custNotes] !== undefined) {
      await updateCustomerNotesIfNeeded(rf._custEditId, rf._custEditRow, rf[COLS.custNotes]);
    }

    S.saving = false;
    showToast(isOverpay && inv2 ? '✅ נשמרו 2 קבלות!' : `✅ הקבלה נשמרה!${rowInfo}${photoNote}`, 'ok', 2500);
    setTimeout(() => { S.screen = 'list'; S.rForm = efR(); S.msg = null; setHeader(); render(); }, 1600);
  } catch (e) { showToast('❌ ' + (e.message || 'שגיאה'), 'err'); S.saving = false; renderSaveBtnRec(); }
}

async function saveInv(isTax) {
  const f = S.iForm;
  const calc = calcInv(f);

  if (!f[COLS.docCustId]?.trim()) {
    showToast('❌ ת"ז / ח"פ של הלקוח הוא שדה חובה', 'err');
    return;
  }

  if (isTax) {
    const err = taxFormErrors();
    if (err) {
      showToast('❌ ' + err, 'err');
      return;
    }

    const paid  = parseFloat(f[COLS.taxPayAmt] || 0);
    const total = calc.withVat;
    const isCashPayment = f[COLS.taxPayType] === 'מזומן';

    if (total > 0 && paid < total - 0.5) {
      if (isCashPayment) {
        const totalFmt = '₪' + Math.round(total).toLocaleString('he-IL');
        const paidFmt  = '₪' + Math.round(paid).toLocaleString('he-IL');
        showConfirm(
          '📄 יוצרו 2 מסמכים',
          `לחיצה על אישור תיצור:\n\n• חשבונית על סה"כ ${totalFmt} (כולל מע"מ אחר הנחה)\n• קבלה על ${paidFmt} מזומן\n\nהאם להמשיך?`,
          function() { executeSaveInv(isTax, calc); }
        );
      } else {
        const diff = Math.round(total - paid).toLocaleString('he-IL');
        showConfirm('⚠️ תשלום חלקי', 'שולם: ₪' + Math.round(paid).toLocaleString('he-IL') + '\nלתשלום: ₪' + Math.round(total).toLocaleString('he-IL') + '\nיתרה: ₪' + diff + '\n\nהאם ברצונך להמשיך בשמירה?', function() {
          executeSaveInv(isTax, calc);
        });
      }
    } else {
      executeSaveInv(isTax, calc);
    }
  } else {
    executeSaveInv(isTax, calc);
  }
}

async function executeSaveInv(isTax, calc) {
  const f = S.iForm;
  const paid  = parseFloat(f[COLS.taxPayAmt] || 0);
  const total = calc.withVat;

  const isCashPartial = isTax && f[COLS.taxPayType] === 'מזומן' && total > 0.5 && paid < total - 0.5;

  if (isTax && !isCashPartial && f[COLS.taxPayType] === 'שיק' && total > 0 && paid > total + 0.5 && f._overInvNum?.trim()) {
    const diff = Math.round(paid - total).toLocaleString('he-IL');
    const note = `ההפרש ₪${diff} שולם עבור חשבונית מספר ${f._overInvNum.trim()}`;
    f[COLS.taxNotes] = f[COLS.taxNotes]?.trim() ? (f[COLS.taxNotes].trim() + ' | ' + note) : note;
  }

  const qkCols = PRODS.map(p => p.qk);
  const allowed = new Set([COLS.docCustId, COLS.docCustName, COLS.docDate, COLS.price, COLS.discount, COLS.subtotal, COLS.afterDisc, ...qkCols]);

  if (isTax && !isCashPartial) {
    [COLS.taxTotalVat, COLS.taxPayType, COLS.taxPayAmt, COLS.taxPayDate, COLS.taxChkNum, COLS.taxNotes, COLS.taxNum].forEach(k => allowed.add(k));
  } else if (!isCashPartial) {
    [COLS.invTerms, COLS.invTotalVat, COLS.invNum, COLS.invNotes].forEach(k => allowed.add(k));
  }

  const data = {};
  allowed.forEach(k => {
    const val = (f[k] || '').toString().trim();
    const isQty = qkCols.includes(k);
    data[k] = (isQty && (val === '' || val === '0')) ? '' : val;
  });

  if (isCashPartial) {
    const cust = S.customers.find(c => c[COLS.custId] === (f[COLS.docCustId] || '').trim());
    data[COLS.invTerms]   = cust ? (cust[COLS.custTerms] || '') : '';         
    data[COLS.invTotalVat] = total > 0 ? String(Math.round(total)) : '';      
    data[COLS.invNotes]   = (f[COLS.taxNotes] || '').toString().trim();       
  }

  const qtySummary = PRODS.filter(p => parseInt(data[p.qk]) > 0)
    .map(p => p.short + ': ' + data[p.qk]).join(', ');

  S.saving = true;
  renderSaveBtn();
  try {
    const saveToTax = isTax && !isCashPartial;
    const payload = {
      action:    saveToTax ? 'addTax' : 'addInvoice',
      sheetName: SHEETS[saveToTax ? 'tax' : 'invoices'],
      data,
      photoBase64: f._photoDataUrl ? (f._photoBase64 || '') : ''
    };
    await apiPost(payload);

    if (isTax && !isCashPartial) {
      const isChq    = f[COLS.taxPayType] === 'שיק';
      const paidAmt  = parseFloat(f[COLS.taxPayAmt] || 0);
      const isOverpay = isChq && total > 0 && paidAmt > total + 0.5;
      if (isOverpay && f._overInvNum?.trim()) {
        const excess = Math.round((paidAmt - total) * 100) / 100;
        const overInvRaw = f._overInvNum.trim();
        const overInvVal = overInvRaw && /^\d+$/.test(overInvRaw) ? parseInt(overInvRaw, 10) : overInvRaw;
        const recData = {
          [COLS.recInvNum]:  overInvVal,
          [COLS.recPayType]: f[COLS.taxPayType],
          [COLS.recPayAmt]:  excess,
          [COLS.recPayDate]: f[COLS.taxPayDate] || tod(),
          [COLS.recChkNum]:  f[COLS.taxChkNum] || '',
          [COLS.recNotes]:   'יתרת שיק מחשמ"ק שנוצר עכשיו'
        };
        await apiPost({ action: 'addReceipt', data: recData, photoBase64: f._photoDataUrl ? (f._photoBase64 || '') : '' });
        S.receipts.push({ ...recData, _id: S.receipts.length, _bg: '#ffffff' });
      }
    }

    if (isCashPartial) {
      const custId  = (f[COLS.docCustId] || '').trim();
      const invDate = (f[COLS.docDate] || tod()).trim();
      const recNotes = `ת"ז/ח"פ: ${custId || '—'} | תאריך: ${invDate} | סה"כ חשבונית: ₪${Math.round(total).toLocaleString('he-IL')} | שולם מזומן: ₪${Math.round(paid).toLocaleString('he-IL')}`;
      const recData = {
        [COLS.recInvNum]:  '',       
        [COLS.recPayType]: 'מזומן',
        [COLS.recPayAmt]:  Math.round(paid * 100) / 100,
        [COLS.recPayDate]: invDate,
        [COLS.recChkNum]:  '',
        [COLS.recNotes]:   recNotes
      };
      await apiPost({ action: 'addReceipt', data: recData });
      S.receipts.push({ ...recData, _id: S.receipts.length, _bg: '#ffffff' });
    }

    if (f._custEditRow && f[COLS.custNotes] !== undefined) {
      await updateCustomerNotesIfNeeded(f._custEditId, f._custEditRow, f[COLS.custNotes]);
    }

    S.msg = {
      t: 's',
      m: isCashPartial
        ? `✅ חשבונית וקבלה נשמרו! ${qtySummary || 'ללא כמויות'}`
        : `${isTax ? 'חשמ"ק' : 'חשבונית'} נשמרה! ${qtySummary || 'ללא כמויות'}`
    };
    S.saving = false; render();
    setTimeout(() => {
      S.screen = 'list'; S.iForm = {}; S.msg = null;
      if (saveToTax) { S.tsState = 'idle'; S.tax = []; }
      else           { S.isState = 'idle'; S.invoices = []; }
      if (isCashPartial) { S.rsState = 'idle'; S.receipts = []; }
      setHeader();
      if (saveToTax) loadTax(); else loadInvoices();
    }, 2500);
  } catch (e) {
    showToast('❌ שגיאה: ' + e.name + ' — ' + e.message, 'err');
    S.saving = false;
    renderSaveBtn();
  }
}

// ── UI Components & Dialogs ──
function renderSaveBtn() {
  const btn = document.getElementById('btn-save-inv');
  if (!btn) return;
  const isTax = S.screen === 'new-tax';
  const validErr = isTax ? taxFormErrors() : invoiceFormErrors();
  const dis = S.saving || !!validErr;
  btn.disabled = dis;
  btn.style.background = dis ? '#ccc' : tc();
  btn.textContent = S.saving ? '⏳ שומר...' : (validErr ? '⛔ ' + validErr : (isTax ? '💾 שמור חשמ"ק' : '💾 שמור חשבונית'));
}

function renderSaveBtnRec() {
  const btn = document.getElementById('btn-save-rec');
  if (!btn) return;
  const validErr = receiptFormErrors();
  const dis = S.saving || !!validErr;
  btn.disabled = dis;
  btn.style.background = dis ? '#ccc' : tc();
  btn.textContent = S.saving ? '⏳ שומר...' : (validErr ? '⛔ ' + validErr : '💾 שמור קבלה');
  renderOverInvPicker(); 
}

function showConfirm(title, text, onYes, onNo) {
  const modal = document.getElementById('confirm-modal');
  const tEl = document.getElementById('confirm-title');
  const bodyEl = document.getElementById('confirm-text');
  const yesBtn = document.getElementById('confirm-yes');
  const noBtn = document.getElementById('confirm-no');
  if (!modal) return;
  tEl.textContent = title;
  bodyEl.textContent = text;
  modal.style.display = 'flex';
  
  yesBtn.onclick = function() {
    modal.style.display = 'none';
    if (onYes) onYes();
  };
  noBtn.onclick = function() {
    modal.style.display = 'none';
    if (onNo) onNo();
  };
}

function bindAll() {
  const si = document.getElementById('sinput');
  if (si) {
    si.addEventListener('input', e => {
      S.search = e.target.value;
      const fc = filteredC();
      const cnt = document.getElementById('scnt');
      if (cnt) cnt.textContent = `${fc.length} לקוחות${S.search ? ` (מתוך ${S.customers.length})` : ''} `;
      const wrap = document.getElementById('cust-cards-wrap');
      if (wrap) wrap.innerHTML = buildCustCardsHtml(fc);
    });
  }
  ['inv-filter-cust', 'inv-filter-num'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', e => setInvFilter(el.dataset.key, e.target.value));
  });
  ['rec-filter-cust', 'rec-filter-num'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', e => setRecFilter(el.dataset.key, e.target.value));
  });
}

function clearSearch() {
  S.search = '';
  render();
  setTimeout(() => document.getElementById('sinput')?.focus(), 50);
}

function tog(id) {
  S.expId = S.expId === id ? null : id;
  render();
  setTimeout(() => document.querySelector('.card.exp')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

async function cp(text, key) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
  }
  if (S.copiedTimer) clearTimeout(S.copiedTimer);
  S.copied = key; render();
  S.copiedTimer = setTimeout(() => { S.copied = null; render(); }, 2000);
}

window.addEventListener('DOMContentLoaded', () => {
  S.cForm = efC(); S.rForm = efR(); S.tab = 'customers'; S.screen = 'list';
  setHeader();
  syncNav();
  requestAnimationFrame(syncNav);

  window.addEventListener('beforeunload', e => {
    e.preventDefault();
    return e.returnValue = 'האם אתה בטוח שברצונך לצאת מהאפליקציה?';
  });

  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    if (S.screen !== 'list') {
      history.pushState(null, '', location.href);
      goBack();
    } else {
      showConfirm('יציאה מהאפליקציה', 'האם אתה בטוח שברצונך לצאת מהאפליקציה?', function() {
        history.back();
      }, function() {
        history.pushState(null, '', location.href);
      });
    }
  });

  if (S.scriptUrl) {
    loadCustomers(); 
    render();
    pingSheets();    
  } else render();
});
</script>
