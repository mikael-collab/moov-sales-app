<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOOV Sales">
<title>MOOV Sales</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{height:100%;}
body{height:100%;font-family:'Heebo','Arial Hebrew',Arial,sans-serif;background:#f0f0f0;overflow:hidden;}
#app{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  background:#f5f5f5;overflow:hidden;
}
/* Header */
.hdr{flex-shrink:0;padding:12px 14px 10px;background:#1a73e8;color:#fff;transition:background .25s;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;}
.hdr-mid{text-align:center;flex:1;}
.hdr-mid h1{font-size:16px;font-weight:600;margin:0;}
.hdr-mid p{font-size:11px;opacity:.75;margin:0;}
.hdr-mid p.inv-totals{font-size:15px;font-weight:700;opacity:1;margin:2px 0 0;letter-spacing:.2px;}
.hdr-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;width:36px;height:36px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.hdr-btn.hidden{visibility:hidden;}
/* Content */
#content{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}
/* Bottom Nav */
.bnav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid #e0e0e0;padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 9px;border:none;background:transparent;cursor:pointer;font-family:inherit;border-top:2.5px solid transparent;transition:border-color .2s,color .2s,background .2s;color:#aaa;}
.bnav-btn .ico{font-size:18px;margin-bottom:2px;}
.bnav-btn .lbl{font-size:9px;font-weight:500;white-space:nowrap;line-height:1;}
/* Search */
.sbar{background:#fff;border-bottom:1px solid #ebebeb;padding:10px 12px;position:sticky;top:0;z-index:10;}
.swrap{position:relative;}
.sinput{width:100%;padding:10px 36px 10px 30px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;background:#f8f8f8;outline:none;direction:rtl;-webkit-appearance:none;}
.sico">🔍</span>
      ${S.search?`<button class="sclr" onclick="clearSearch()">×</button>`:''}
    </div>
    <div class="smeta">
      <span id="scnt">${st==='ok'?`${fc.length} לקוחות${S.search?` (מתוך ${S.customers.length})`:''}`:'...'}</span>
      <button class="sref" style="color:${color}" onclick="loadCustomers()">↻ רענן</button>
    </div>
  </div>`;
  if(st!=='ok')return h+statusHtml(st,'loadCustomers()','לקוחות');
  if(!fc.length){
    if(!S.customers.length)return h+`<div class="status"><p style="color:#999;margin-bottom:16px">אין לקוחות</p>
      <button onclick="openNewCustomer()" style="background:${color};color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer">+ הוסף לקוח</button></div>`;
    return h+`<div class="status"><p style="color:#999">אין תוצאות עבור "${esc(S.search)}"</p></div>`;
  }
  h+=`<div style="padding:8px 0 24px">`;
  fc.forEach((c,i)=>{h+=cCard(c,i);});
  return h+`</div>`;
}
function cCard(c,i){
  const isE=S.expId===c._id;const bg=rowBg(c,isE);const cpd=S.copied===`${c._id}-id`;
  const color=tc();const bank=c[COLS.custBankHolder]||c[COLS.custBankName]||c[COLS.custBankBranch]||c[COLS.custBankAcct];
  return`<div class="card${isE?' exp':''}" style="background:${bg};${isE?`--tc:${color}`:''}">
    <div class="card-hdr" onclick="tog(${c._id})">
      <div class="r1">
        <span class="cust-name">${esc(c[COLS.custBiz]||c[COLS.custName]||'—')}</span>
        ${c[COLS.custId]?`<span class="id-badge">${esc(c[COLS.custId])}</span>
          <button class="copy-btn${cpd?' done':''}" onclick="event.stopPropagation();cp('${esc(c[COLS.custId])}','${c._id}-id')"
            style="${cpd?`background:${color};border-color:${color};color:#fff`:''}">
            ${cpd?'✓ הועתק':'📋 העתק'}</button>`:''}
        ${c[COLS.custName]&&c[COLS.custBiz]?`<span class="biz-name" style="color:#888;font-size:12px">${esc(c[COLS.custName])}</span>`:''}
      </div>
      <div class="r2">
        ${c[COLS.custPhone]?`<span>📱 ${esc(c[COLS.custPhone])}</span>`:''}
        ${c[COLS.custEmail]?`<span style="direction:ltr;overflow:hidden;text-overflow:ellipsis;max-width:160px">✉ ${esc(c[COLS.custEmail])}</span>`:''}
        ${(c[COLS.custStreet]||c[COLS.custCity])?`<span>📍 ${esc([c[COLS.custStreet],c[COLS.custCity]].filter(Boolean).join(', '))}</span>`:''}
      </div>
      <div class="r3">
        ${bank&&!isE?`<span class="tag">🏦 פרטי בנק</span>`:'<span></span>'}
        <span class="toggle-hint" style="color:${isE?color:'#bbb'}">${isE?'▲ סגור':'▼ פרטים'}</span>
      </div>
    </div>
    ${isE?cCardBody(c,color):''}
  </div>`;
}
function cCardBody(c,color){
  let h=`<div class="card-body"><div class="sec-t">פרטי קשר</div><div class="g2" style="margin-bottom:12px">`;
  CF.filter(f=>!f.bank&&c[f.k]).forEach(f=>{
    h+=`<div class="gcell${[COLS.custEmail,COLS.custStreet].includes(f.k)?' wide':''}">
      <div class="glabel">${f.label}</div>
      <div class="gval" style="direction:${f.mode==='email'?'ltr':'rtl'}">${esc(c[f.k])}</div>
    </div>`;
  });
  h+=`</div>`;
  const bankF=CF.filter(f=>f.bank&&c[f.k]);
  if(bankF.length){
    h+=`<div class="sec-t">🏦 פרטי בנק</div><div class="dtable">`;
    bankF.forEach((f,i)=>{h+=`<div class="dtrow"${i===0?' style="border-top:none"':''}>
      <span class="dtlabel">${f.label}</span>
      <span class="dtval" style="${[COLS.custBankBranch,COLS.custBankAcct].includes(f.k)?'font-family:monospace;letter-spacing:1px':''}">${esc(c[f.k])}</span>
    </div>`;});
    h+=`</div>`;
  }
  h+=`<button onclick="editCust(${c._id})"
    style="width:100%;margin-top:10px;padding:11px;border-radius:8px;border:1.5px solid ${color};
    background:transparent;color:${color};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">
    ✏️ ערוך פרטי לקוח
  </button>`;
  return h+`</div>`;
}

function renderCustForm(){
  const color=tc();const isEdit=!!S.cForm._editId;
  let h=`<div class="fwrap" style="--tc:${color}">`;
  if(S.msg)h+=alertHtml(S.msg);
  h+=`<div class="sec-t">${isEdit?'✏️ עריכת לקוח':'פרטי לקוח'}</div>`;
  CF.filter(f=>!f.bank).forEach(f=>{h+=custField(f);});
  h+=`<div class="fdivider"><hr><span>🏦 פרטי בנק</span><hr></div>`;
  CF.filter(f=>f.bank).forEach(f=>{h+=custField(f);});
  
  const btnDisabled=S.saving;
  const btnLabel=S.saving?'⏳ שומר...':(isEdit?'💾 עדכן לקוח':'💾 שמור לקוח');
  h+=`<button class="save-btn" style="background:${btnDisabled?'#ccc':color}" ${btnDisabled?'disabled':''} onclick="saveCust()">
    ${btnLabel}</button></div>`;
  return h;
}
function custField(f){
  const vv=esc(S.cForm[f.k]||'');
  if(f.k===COLS.custId)return`<div class="field"><label>${f.label} <small>(עמודה ${f.k}${f.req?' *':''})</small></label>
    <div class="irow">
      <input type="text" inputmode="numeric" id="f-id" class="finput num" value="${vv}"
        oninput="uf('cForm','${f.k}',this.value.replace(/[^0-9-]/g,''))">
      <button class="dash-btn" onclick="addDashC()">-</button>
    </div></div>`;
  const im=f.mode==='num'?'numeric':f.mode==='tel'?'tel':f.mode==='email'?'email':'text';
  return`<div class="field"><label>${f.label} <small>(עמודה ${f.k}${f.req?' *':''})</small></label>
    <input type="${f.mode==='email'?'email':f.mode==='tel'?'tel':'text'}" inputmode="${im}"
      id="fc-${f.k}" class="finput" value="${vv}" style="direction:${f.mode==='email'?'ltr':'rtl'}"
      oninput="uf('cForm','${f.k}',this.value)">
  </div>`;
}

let _invCustLookupTimer = null;
function onInvCustIdInput(val) {
  S.iForm[COLS.docCustId] = val;
  renderSaveBtn();
  clearTimeout(_invCustLookupTimer);
  _invCustLookupTimer = setTimeout(() => {
    S.iForm._openInvs = openInvsFor(val.trim());
    renderTaxOpenInvs();
  }, 400);
}

function setTaxOverInv(num) {
  S.iForm._overInvNum = num;
  const el = document.getElementById('inv-overInvNum');
  if(el) el.value = num;
  renderTaxOpenInvs();
  renderSaveBtn();
}

function buildTaxOpenInvsHtml() {
  const f = S.iForm;
  if (!f._openInvs || !f._openInvs.length) return '';
  let h = `<div class="dtable" style="margin-bottom:12px">
    <div class="dthead" style="background:${tc()}"><span>בחר חשבונית לכיסוי ההפרש</span></div>`;
  f._openInvs.forEach((inv, i) => {
    const invNum = nz(inv[COLS.invNum]) || '—';
    const invDate = nz(inv[COLS.docDate]) || '';
    const balance = getInvBalance(invNum);
    const selected = f._overInvNum === invNum;
    h += `<div class="dtrow" style="cursor:pointer;${selected ? `background:${tc()}15;` : ''}${i === 0 ? 'border-top:none' : ''}"
      onclick="setTaxOverInv('${esc(invNum)}')">
      <div>
        <div style="font-size:13px;font-weight:600;color:${selected ? tc() : '#222'}">#${esc(invNum)}</div>
        <div style="font-size:11px;color:#888">${esc(invDate)}</div>
      </div>
      <div style="text-align:left">
        <div style="font-size:14px;font-weight:700;color:${tc()}">יתרה: ${fmt(String(balance))}</div>
        ${selected ? `<div style="font-size:10px;color:${tc()}">✓ נבחרה</div>` : ''}
      </div>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function renderTaxOpenInvs() {
  const container = document.getElementById('tax-open-invs-container');
  if (container) container.innerHTML = buildTaxOpenInvsHtml();
}


function renderInvForm(isTax){
  const color=tc();const f=S.iForm;
  const calc=calcInv(f);
  const price=parseFloat(f[COLS.price])||0;

  let cansText,totalText;
  if(price>0&&calc.totalQty>0){
    cansText=`${calc.totalQty} יח'`;
    totalText=`₪${Math.round(calc.withVat).toLocaleString('he-IL')} כולל מע"מ`;
  }else if(price>0){
    cansText=`מחיר ₪${fmtNum(price)}`;
    totalText='הזן כמויות';
  }else{
    cansText='הזן מחיר';
    totalText='וכמויות';
  }

  let h=`<div class="fwrap" style="--tc:${color}">
  <div class="sticky-totals" id="sticky-totals" style="background:${color}">
    <span class="st-cans" id="st-cans">${esc(cansText)}</span>
    <span class="st-total" id="st-total">${esc(totalText)}</span>
  </div>`;

  if(S.msg)h+=alertHtml(S.msg);

  h+=`<div class="fdivider" style="margin-top:0"><hr><span>👤 לקוח</span><hr></div>
  <div class="field"><label>חיפוש לקוח / שם עסק <small>(לחיפוש) *</small></label>
    <div class="field-wrap">
      <input type="text" id="inv-custName" class="finput" value="${esc(f[COLS.docCustName])}" placeholder="הקלד לחיפוש..."
        oninput="onInvCustSearch(this.value)" autocomplete="off">
      ${S.showSuggest&&S.suggest.length?suggestHtmlInv():''}
    </div>
  </div>
  <div class="field"><label>ת"ז / ח"פ <small>(עמודה ${COLS.docCustId}) *</small></label>
    <input type="text" inputmode="numeric" id="inv-custId" class="finput num" value="${esc(f[COLS.docCustId])}"
      placeholder="הזן ת\"ז או ח\"פ..."
      oninput="onInvCustIdInput(this.value)">
  </div>`;
  
  if (isTax) {
    h+= `<div id="tax-open-invs-container" style="margin-top: 12px;">${buildTaxOpenInvsHtml()}</div>`;
  }
  
  h+=`<div class="field"><label>תאריך <small>(עמודה ${COLS.docDate})</small></label>
    <input type="date" id="inv-date" class="finput" style="direction:ltr;text-align:left"
      value="${dateToISO(f[COLS.docDate])}" max="${dateToISO(tod())}"
      oninput="uf('iForm','${COLS.docDate}',isoToHeb(this.value))">
  </div>`;

  h+=`<div class="fdivider"><hr><span>📦 מוצרים</span><hr></div>
  <div class="dtable" style="margin-bottom:10px">`;
  PRODS.forEach(p=>{
    const qty=parseInt(f[p.qk])||0;
    h+=`<div class="prod-field">
      <input type="text" inputmode="numeric" class="pf-input" value="${qty||''}"
        placeholder="0" style="--tc:${color}"
        oninput="updProd('${p.qk}',this.value)">
      <div class="pf-left">
        <div><div class="pf-name">${p.short}</div><div class="pf-sub">${p.heb} • ${p.nic}mg</div></div>
        <span class="pf-em">${p.em}</span>
      </div>
    </div>`;
  });
  h+=`</div>`;

  h+=`<div class="fdivider"><hr><span>💰 תמחור</span><hr></div>
  <div class="field"><label>מחיר ליחידה ₪ (לפני מע"מ) <small>(עמודה ${COLS.price})</small></label>
    <input type="text" inputmode="decimal" id="inv-price" class="finput num" value="${esc(f[COLS.price])}"
      placeholder="0.00" oninput="uf('iForm','${COLS.price}',this.value);refreshCalc()">
  </div>`;

  if(calc.totalQty>0&&parseFloat(f[COLS.price])>0){
    h+=`<div id="calc-preview" style="background:#f8f8f8;border-radius:10px;padding:4px;margin-bottom:12px">
      <div class="calc-row"><span class="calc-label">סה"כ יחידות</span><span class="calc-val">${calc.totalQty}</span></div>
      <div class="calc-row"><span class="calc-label">סה"כ לפני מע"מ</span><span class="calc-val">₪${fmtNum(calc.aa)}</span></div>`;
    if(calc.disc>0)h+=`<div class="calc-row"><span class="calc-label">אחרי הנחה ${calc.disc}%</span><span class="calc-val">₪${fmtNum(calc.ac)}</span></div>`;
    h+=`<div class="calc-row"><span class="calc-label">סה"כ כולל מע"מ 18%</span><span class="calc-val hi" style="--tc:${color}">₪${fmtNum(calc.withVat)}</span></div>
    </div>`;
  }else{
    h+=`<div id="calc-preview"></div>`;
  }

  h+=`<div class="field"><label>הנחה % <small>(עמודה ${COLS.discount})</small></label>
    <input type="text" inputmode="numeric" class="finput num" value="${esc(f[COLS.discount])}" placeholder="0"
      oninput="uf('iForm','${COLS.discount}',this.value);refreshCalc()">
  </div>`;

  if(isTax){
    const isChq=f[COLS.taxPayType]==='שיק';
    const isCash=f[COLS.taxPayType]==='מזומן';
    const paid=parseFloat(f[COLS.taxPayAmt]||0);
    const total=Math.round(calc.withVat);
    const isOver=isChq && total>0 && paid>total+0.5;

    h+=`<div class="fdivider"><hr><span>💳 תשלום</span><hr></div>

    <div class="field"><label>סוג תשלום <small>(עמודה ${COLS.taxPayType}) *</small></label>
      <select class="finput" onchange="uf('iForm','${COLS.taxPayType}',this.value);render()">
        <option value="">-- בחר --</option>
        ${PAYMENT_TYPES.map(pt=>`<option${f[COLS.taxPayType]===pt?' selected':''}>${pt}</option>`).join('')}
      </select>
    </div>

    <div class="field"><label>סכום התשלום ₪ <small>(עמודה ${COLS.taxPayAmt}) *</small></label>
      <input type="text" inputmode="decimal" class="finput num" value="${esc(f[COLS.taxPayAmt])}"
        oninput="uf('iForm','${COLS.taxPayAmt}',this.value);renderSaveBtn()"
        onchange="uf('iForm','${COLS.taxPayAmt}',this.value);render()">
    </div>

    ${isCash?`
    <div class="field"><label>תאריך תשלום <small>(עמודה ${COLS.taxPayDate})</small></label>
      <input type="text" class="finput" value="${esc(f[COLS.taxPayDate]||tod())}" readonly
        style="background:#f0f0f0;color:#888;cursor:default">
    </div>`:''}

    ${isChq?`
    <div class="field"><label>מספר שיק <small>(עמודה ${COLS.taxChkNum}) *</small></label>
      <input type="text" inputmode="numeric" class="finput num" value="${esc(f[COLS.taxChkNum])}"
        oninput="uf('iForm','${COLS.taxChkNum}',this.value);renderSaveBtn()">
    </div>
    <div class="field"><label>תאריך פרעון שיק <small>(עמודה ${COLS.taxPayDate}) *</small></label>
      <input type="text" class="finput" value="${esc(f[COLS.taxPayDate]||tod())}"
        oninput="uf('iForm','${COLS.taxPayDate}',this.value);renderSaveBtn()">
    </div>
    <div class="field"><label>צילום שיק <small>(עמודה ${COLS.taxPhoto}) *</small></label>
      <input type="file" id="cheque-photo" accept="image/*" capture="environment"
        style="position:absolute;width:1px;height:1px;opacity:0;" onchange="onPhotoChange(this)">
      <button type="button" class="finput"
        style="text-align:center;cursor:pointer;background:${f._photoTaken?'#e6f4ea':'#f8f8f8'};color:${f._photoTaken?'#1e8e3e':'#555'};font-size:14px;"
        onclick="document.getElementById('cheque-photo').click()">
        ${f._photoTaken?'✅ תמונה צולמה — לחץ לשינוי':'📷 צלם שיק'}
      </button>
      ${f._photoDataUrl?`<img src="${f._photoDataUrl}" style="margin-top:8px;width:100%;border-radius:8px;max-height:160px;object-fit:cover">`:''}
    </div>
    ${isOver?`
    <div style="background:#fff8e1;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#e65100;">
      ⚠️ השיק גבוה ב-₪${Math.round(paid-total).toLocaleString('he-IL')} — סמן חשבונית פתוחה לעיל, או הזן מספר חשבונית ידנית עבור ההפרש
    </div>
    <div class="field"><label>מספר חשבונית עבור ההפרש *</label>
      <input type="text" inputmode="numeric" id="inv-overInvNum" class="finput num" value="${esc(f._overInvNum||'')}"
        placeholder="מספר חשבונית"
        oninput="uf('iForm','_overInvNum',this.value); renderTaxOpenInvs(); renderSaveBtn();">
    </div>`:''}
    `:''}

    <div class="field"><label>הערות <small>(עמודה ${COLS.taxNotes})</small></label>
      <textarea class="finput" rows="3" id="inv-notes"
        oninput="uf('iForm','${COLS.taxNotes}',this.value)">${esc(f[COLS.taxNotes])}</textarea>
    </div>`;
  }

  const validErr = isTax ? taxFormErrors() : invoiceFormErrors();
  const btnDisabled = S.saving || !!validErr;
  const btnLabel = S.saving ? '⏳ שומר...' : (validErr ? '⛔ ' + validErr : (isTax ? '💾 שמור חשמ"ק' : '💾 שמור חשבונית'));
  
  h+=`<button id="btn-save-inv" class="save-btn" style="background:${btnDisabled?'#ccc':color}" ${btnDisabled?'disabled':''} onclick="saveInv(${isTax})">
    ${btnLabel}</button></div>`;
  return h;
}

function suggestHtmlReceipt(){
  return`<div class="suggest-box" id="suggest-box">
    ${S.suggest.slice(0,6).map(c=>`<div class="sug-item" onmousedown="event.preventDefault()" onclick="pickCustomer('${esc(c[COLS.custName]||'')}','${esc(c[COLS.custId]||'')}')">
      <div>${esc(c[COLS.custBiz]||c[COLS.custName]||'—')}</div>
      <div class="sug-sub">${c[COLS.custBiz]&&c[COLS.custName]?esc(c[COLS.custName])+' · ':''}${c[COLS.custId]?esc(c[COLS.custId]):''}</div>
    </div>`).join('')}
  </div>`;
}
function suggestHtmlInv(){
  return`<div class="suggest-box" id="suggest-box">
    ${S.suggest.slice(0,6).map(c=>`<div class="sug-item" onmousedown="event.preventDefault()" onclick="pickInvCust('${esc(c[COLS.custId]||'')}','${esc(c[COLS.custBiz]||c[COLS.custName]||'')}')">

    </div>`).join('')}
  </div>`;
}

function buildOpenInvsHtml() {
  const rf = S.rForm;
  if(!rf._openInvs || !rf._openInvs.length) return '';
  let h = `<div class="fdivider"><hr><span>📄 חשבוניות פתוחות</span><hr></div>
  <div class="dtable" style="margin-bottom:12px">
    <div class="dthead" style="background:${tc()}"><span>בחר חשבונית לתשלום</span><span>${rf._openInvs.length} פתוחות</span></div>`;
  rf._openInvs.forEach((inv,i)=>{
    const invNum=nz(inv[COLS.invNum])||'—';
    const invDate=nz(inv[COLS.docDate])||'';
    const balance=getInvBalance(invNum);
    const rawTotal=parseFloat(nz(inv[COLS.invTotalVat]))||0;
    const hasPartial=balance<rawTotal-0.1;
    const selected=rf[COLS.recInvNum]===invNum;
    h+=`<div class="dtrow" style="cursor:pointer;${selected?`background:${tc()}15;`:''}${i===0?'border-top:none':''}"
      onclick="pickReceiptInv('${esc(invNum)}','${balance}','${esc(invDate)}')">
      <div>
        <div style="font-size:13px;font-weight:600;color:${selected?tc():'#222'}">#${esc(invNum)}</div>
        <div style="font-size:11px;color:#888">${esc(invDate)}</div>
        ${hasPartial?`<div style="font-size:10px;color:#e65100">שולם חלקית: ₪${Math.round(rawTotal-balance).toLocaleString('he-IL')}</div>`:''}
      </div>
      <div style="text-align:left">
        <div style="font-size:14px;font-weight:700;color:${tc()}">יתרה: ${fmt(String(balance))}</div>
        ${selected?`<div style="font-size:10px;color:${tc()}">✓ נבחרה</div>`:''}
      </div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function renderOpenInvs() {
  const container = document.getElementById('open-invs-container');
  if(container) container.innerHTML = buildOpenInvsHtml();
}

          </div>

function renderDocList(data,state,isTax){
  const label=isTax?'חשבוניות/קבלות':'חשבוניות';
  const reload=isTax?'loadTax()':'loadInvoices()';
  const color=tc();const errMsg=S.errors[isTax?'tax':'invoices'];
  const totalKey=isTax?COLS.taxTotalVat:COLS.invTotalVat;
  const numKey=isTax?COLS.taxNum:COLS.invNum;
  const tail=isTax?TAX_TAIL:INV_TAIL;
  if(state==='error')return errScreen(S.errors[isTax?'tax':'invoices'],reload,label,color);
  if(state!=='ok')return statusHtml(state,reload,label);
  if(!data.length)return`<div class="status">
    <p style="font-size:36px;margin-bottom:10px">${isTax?'📋':'📄'}</p>
    <p style="color:#999;margin-bottom:6px">אין ${label} שהושלמו</p>
    <p style="font-size:12px;color:#bbb;margin-bottom:16px">רק שורות עם סכום מאושר יוצגו</p>
    <button onclick="${reload}" style="background:${color};color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer">↻ רענן</button>
  </div>`;

  let h=`<div style="padding-bottom:24px">`;

  [...data].reverse().forEach((r,i)=>{
    const id=`${isTax?'t':'v'}-${r._id}`;const isE=S.expId===id;const bg=rowBg(r,isE);
    const totVAT=nz(r[totalKey]);const invNum=nz(r[numKey]);
    const bizName=nz(r[COLS.docCustName]);const custId=nz(r[COLS.docCustId]);const date=nz(r[COLS.docDate]);
    const prods=PRODS.filter(p=>{const q=parseFloat(r[p.qk]);return!isNaN(q)&&q>0;});
    const totItems=prods.reduce((s,p)=>s+(parseFloat(r[p.qk])||0),0);
    const balance=(!isTax&&invNum)?getInvBalance(invNum):null;
    const isRed = (!isTax && invNum) ? isInvRed(r) : false;
    const hasPartialPay=balance!==null&&balance>0&&balance<parseMoney(totVAT)-0.5;

    h+=`<div class="card${isE?' exp':''}" style="background:${bg};${isE?`--tc:${color}`:''}">
      <div class="card-hdr" onclick="tog('${id}')">
        <div class="r1">
          ${invNum?`<span class="nbadge" style="background:${color}">#${esc(invNum)}</span>`:''}
          <span style="font-weight:600;font-size:14px;color:#222;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(bizName||custId||'—')}</span>
          <div style="text-align:left;flex-shrink:0">
            ${totVAT?`<div style="font-size:15px;font-weight:700;color:${color}">${fmt(totVAT)}</div>`:''}
            ${hasPartialPay?`<div style="font-size:11px;font-weight:700;color:#e65100">יתרה: ₪${Math.round(balance).toLocaleString('he-IL')}</div>`:''}
            ${isRed ? `<div style="font-size:11px;color:#c62828;font-weight:600">סגור (מסומן באדום)</div>` : (balance===0&&totVAT?`<div style="font-size:11px;color:#1e8e3e;font-weight:600">✓ שולם</div>`:'')}
          </div>
        </div>
        <div class="r2">
          ${date?`<span>📅 ${esc(date)}</span>`:''}
          ${prods.slice(0,3).map(p=>`<span class="tag">${p.em} ×${r[p.qk]}</span>`).join('')}
          ${prods.length>3?`<span style="font-size:11px;color:#888">+${prods.length-3}</span>`:''}
          ${totItems>0?`<span style="font-size:11px;color:#aaa;margin-right:auto">${totItems} יח'</span>`:''}
        </div>
        <div class="r3" style="justify-content:flex-end">
          <span class="toggle-hint" style="color:${isE?color:'#bbb'}">${isE?'▲ סגור':'▼ פרטים'}</span>
        </div>
      </div>`;
    if(isE){
      h+=`<div class="card-body">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
          ${custId?`<span class="id-badge">${esc(custId)}</span>`:''}
          ${bizName?`<span style="font-size:13px;font-weight:600">${esc(bizName)}</span>`:''}
          ${date?`<span style="font-size:12px;color:#888;margin-right:auto">📅 ${esc(date)}</span>`:''}
        </div>`;
      if(prods.length){
        h+=`<div class="dtable" style="margin-bottom:10px">
          <div class="dthead" style="background:${color}"><span>פירוט הזמנה</span><span>${totItems} יח'</span></div>`;
        prods.forEach(p=>{
          h+=`<div class="prod-row">
            <div style="display:flex;align-items:center">
              <span class="prod-em">${p.em}</span>
              <div><div class="prod-name">${p.short}</div><div class="prod-sub">${p.heb} • ${p.nic}mg</div></div>
            </div>
            <span class="prod-qty" style="color:${color}">${r[p.qk]} יח'</span>
          </div>`;
        });
        h+=`</div>`;
      }
      const pricing=[
        nz(r[COLS.price])&&{l:'מחיר ליחידה (לפני מע"מ)',vv:fmt(r[COLS.price])},
        nz(r[COLS.subtotal])&&{l:'סה"כ לפני מע"מ',vv:fmt(r[COLS.subtotal])},
        nz(r[COLS.discount])&&{l:'הנחה',vv:r[COLS.discount]+'%',disc:true},
        nz(r[COLS.afterDisc])&&{l:'סה"כ אחר הנחה (לפני מע"מ)',vv:fmt(r[COLS.afterDisc])},
        totVAT&&{l:'סה"כ כולל מע"מ',vv:fmt(totVAT),hi:true},
        hasPartialPay&&{l:'שולם עד כה',vv:`₪${Math.round(parseMoney(totVAT)-balance).toLocaleString('he-IL')}`,paid:true},
        hasPartialPay&&{l:'יתרה לתשלום',vv:`₪${Math.round(balance).toLocaleString('he-IL')}`,bal:true},
        isRed&&{l:'סטטוס',vv:'סגור / בוטל (אדום)',red:true},
        balance===0&&totVAT&&!isRed&&{l:'סטטוס',vv:'✓ שולם במלואו',done:true},
      ].filter(Boolean);
      
      if(pricing.length){
        h+=`<div class="dtable" style="margin-bottom:10px">`;
        pricing.forEach((row,ri)=>{
          const bgStyle=row.hi?`background:${color}15`:row.bal?'background:#fff3e0':row.done?'background:#e6f4ea':row.red?'background:#fce8e6':'';
          const valColor=row.hi?color:row.disc?'#c62828':row.bal?'#e65100':row.done?'#1e8e3e':row.red?'#c62828':row.paid?'#555':'#222';
          const valSize=row.hi||row.bal?15:13;
          h+=`<div class="dtrow" style="${ri===0?'border-top:none;':''}${bgStyle}">
            <span class="dtlabel">${row.l}</span>
            <span class="dtval" style="color:${valColor};font-size:${valSize}px;font-weight:${row.hi||row.bal||row.done?700:500}">${row.vv}</span>
          </div>`;
        });
        h+=`</div>`;
      }
      const payF=tail.filter(f=>nz(r[f.k]));
      if(payF.length){
        h+=`<div class="dtable"><div style="padding:7px 12px;background:#f5f5f5;border-bottom:.5px solid #ebebeb;font-size:12px;font-weight:600;color:#666">פרטי תשלום</div>`;
        payF.filter(f=>!f.wide).forEach((f,fi)=>{h+=`<div class="dtrow"${fi===0?' style="border-top:none"':''}>
          <span class="dtlabel">${f.label}</span>
          <span class="dtval" style="color:${f.money?color:'#222'}">${f.money?fmt(r[f.k]):esc(r[f.k])}</span>
        </div>`;});
        payF.filter(f=>f.wide).forEach(f=>{h+=`<div style="padding:8px 12px;border-top:.5px solid #f0f0f0">
          <div class="glabel">${f.label}</div>
          <div style="font-size:13px;color:#222;margin-top:2px">${esc(r[f.k])}</div></div>`;});
        h+=`</div>`;
      }
      if(!isTax&&isInvOpen(r)){
        h+=`<button onclick="openNewReceiptFromInv(${r._id})"
          style="width:100%;margin-top:10px;padding:11px;border-radius:8px;border:1.5px solid ${color};
          background:transparent;color:${color};font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">
          🧾 צור קבלה לחשבונית זו
        </button>`;
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  return h+`</div>`;
}

let _toastTimer=null;
function showToast(msg,type,duration){
  const c=document.getElementById('toast-container');
  if(!c)return;
  clearTimeout(_toastTimer);
  c.innerHTML=`<div class="toast ${type||'err'}">${esc(msg)}</div>`;
  _toastTimer=setTimeout(()=>{c.innerHTML='';},duration||4000);
}

function alertHtml(msg){return`<div class="alert ${msg.t==='s'?'ok':'err'}">${msg.t==='s'?'✅ ':'❌ '}${esc(msg.m)}</div>`;}
function errScreen(errMsg,reload,label,color){
  return`<div class="status"><p style="font-size:30px;margin-bottom:10px">⚠️</p>

function onPhotoChange(input){
  if(!input.files||!input.files[0])return;
  showToast('⏳ מעבד תמונה...', 'ok', 2000);
  const file=input.files[0];
  const img=new Image();
  img.onload=function(){
    URL.revokeObjectURL(img.src);
    const MAX=800; 
    const ratio=Math.min(MAX/img.width,MAX/img.height,1);
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const b64=c.toDataURL('image/jpeg',0.6);
    S.iForm._photoDataUrl=b64;
    S.iForm._photoBase64=b64;
    S.iForm._photoTaken=true; 
    render();
    setTimeout(()=>{
      const el=document.querySelector('img[src^="data:image"]');
      if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
    },100);
  };
  img.onerror=function(){ showToast('❌ שגיאה בטעינת התמונה', 'err'); };
  img.src=URL.createObjectURL(file);
  input.value='';
}

    setTimeout(()=>{S.screen='list';S.cForm=efC();S.msg=null;setHeader();render();},1500);
  }catch(e){
    showToast('❌ '+(e.message||'שגיאה'), 'err');
    S.saving=false;

  }
}

async function saveReceipt(){
  if(S.saving)return;
  captureReceiptFields();
  const err=receiptFormErrors();
  if(err){showToast('❌ '+err,'err');return;}

  const rf=S.rForm;
  const paid=parseFloat(rf[COLS.recPayAmt])||0;
  const balance=parseFloat(rf._invTotal)||0;
  const isOverpay=rf[COLS.recPayType]==='שיק'&&balance>0.5&&paid>balance+0.5;
  const excess=isOverpay?Math.round(paid-balance):0;
  const inv2=rf._overInvNum?.trim()||'';

  if(balance>0.5&&paid<balance-0.5){
    const diff=Math.round(balance-paid).toLocaleString('he-IL');
    if(!confirm(`⚠️ תשלום חלקי\nשולם: ₪${Math.round(paid).toLocaleString('he-IL')}\nיתרה: ₪${Math.round(balance).toLocaleString('he-IL')}\nנותר: ₪${diff}\n\nלהמשיך?`))return;
  }

  const g1Notes=isOverpay
    ?`שיק ₪${Math.round(paid).toLocaleString('he-IL')} — יתרה חשבונית זו ₪${Math.round(balance).toLocaleString('he-IL')}. ₪${Math.round(excess).toLocaleString('he-IL')} הועברו לחשבונית מספר ${inv2||'—'}${rf[COLS.recNotes]?.trim()?' | '+rf[COLS.recNotes].trim():''}`
    :rf[COLS.recNotes]||'';
    
  const data1={
    [COLS.recInvNum]:rf[COLS.recInvNum]||'',
    [COLS.recPayType]:rf[COLS.recPayType]||'',
    [COLS.recPayAmt]:isOverpay?String(Math.round(balance)):rf[COLS.recPayAmt],
    [COLS.recPayDate]:rf[COLS.recPayDate]||tod(),
    [COLS.recChkNum]:rf[COLS.recChkNum]||'',
    [COLS.recNotes]:g1Notes
  };

  S.saving=true;
  renderSaveBtnRec();
  try {
    const url = S.scriptUrl + '?' + new URLSearchParams({ write: '1', payload: JSON.stringify({ action: 'addReceipt', data: data1, photoBase64: rf._photoBase64 || '' }) });
    await fetch(url);
    
    data1[COLS.recCustName] = rf._custName || '';
    data1[COLS.recCustId] = rf._custId || '';
    S.receipts.push({...data1,_id:S.receipts.length,_bg:'#ffffff'});

    if(isOverpay&&inv2){
      const g2Notes=`שיק ₪${Math.round(paid).toLocaleString('he-IL')} — ₪${Math.round(balance).toLocaleString('he-IL')} שולמו מאותו שיק עבור חשבונית מספר ${rf[COLS.recInvNum]||'—'}`;
      const data2={
        [COLS.recInvNum]:inv2,
        [COLS.recPayType]:rf[COLS.recPayType],
        [COLS.recPayAmt]:String(Math.round(excess)),
        [COLS.recPayDate]:rf[COLS.recPayDate]||tod(),
        [COLS.recChkNum]:rf[COLS.recChkNum]||'',
        [COLS.recNotes]:g2Notes
      };
      const url2 = S.scriptUrl + '?' + new URLSearchParams({ write: '1', payload: JSON.stringify({ action: 'addReceipt', data: data2, photoBase64: rf._photoBase64 || '' }) });
      await fetch(url2);
      
      data2[COLS.recCustName] = rf._custName || '';
      data2[COLS.recCustId] = rf._custId || '';
      S.receipts.push({...data2,_id:S.receipts.length,_bg:'#ffffff'});
    }

    S.saving=false;
    showToast(isOverpay&&inv2?'✅ נשמרו 2 קבלות!':'✅ הקבלה נשמרה!','ok',2500);
    setTimeout(()=>{S.screen='list';S.rForm=efR();S.msg=null;setHeader();render();},1600);
  }catch(e){
    showToast('❌ Error: Network Connection Failed','err');
    S.saving=false;
    render(); 
  }
}

async function saveInv(isTax){
  const f=S.iForm;
  const calc=calcInv(f);

  if(!f[COLS.docCustId]?.trim()){
    showToast('❌ ת"ז / ח"פ של הלקוח הוא שדה חובה', 'err');
    return;
  }

  if(isTax){
    const err=taxFormErrors();
    if(err){ showToast('❌ '+err, 'err'); return; }

    const paid=parseFloat(f[COLS.taxPayAmt]||0);
    const total=Math.round(calc.withVat);
    if(total>0&&paid<total-0.5){
      const diff=Math.round(total-paid).toLocaleString('he-IL');
      if(!confirm(`⚠️ תשלום חלקי\nשולם: ₪${Math.round(paid).toLocaleString('he-IL')}\nלתשלום: ₪${Math.round(total).toLocaleString('he-IL')}\nיתרה: ₪${diff}\n\nלהמשיך?`))return;
    }

    if(f[COLS.taxPayType]==='שיק'&&total>0&&paid>total+0.5&&f._overInvNum?.trim()){
      const diff=Math.round(paid-total).toLocaleString('he-IL');
      const note=`ההפרש ₪${diff} שולם עבור חשבונית מספר ${f._overInvNum.trim()}`;
      f[COLS.taxNotes]=f[COLS.taxNotes]?.trim()?(f[COLS.taxNotes].trim()+' | '+note):note;
    }
  }
  
  const qkCols=PRODS.map(p=>p.qk); 
  const allowed=new Set([COLS.docCustId,COLS.docCustName,COLS.docDate,COLS.price,COLS.discount,COLS.subtotal,COLS.afterDisc,...qkCols]);
  
  if(isTax){
    [COLS.taxTotalVat,COLS.taxPayType,COLS.taxPayAmt,COLS.taxPayDate,COLS.taxChkNum,COLS.taxNotes,COLS.taxNum].forEach(k=>allowed.add(k));
  } else {
    [COLS.invTerms,COLS.invTotalVat,COLS.invNum,COLS.invPayType,COLS.invPayAmt,COLS.invPayDate,COLS.invChkNum,COLS.invNotes].forEach(k=>allowed.add(k));
  }

  const data={};
  allowed.forEach(k=>{
    const val=(f[k]||'').toString();
    const isQty=qkCols.includes(k);
    data[k]=(isQty&&(val===''||val==='0'))?'':val;
  });

  const qtySummary=PRODS.filter(p=>parseInt(data[p.qk])>0)
    .map(p=>p.short+': '+data[p.qk]).join(', ');

  S.saving=true;
  renderSaveBtn();
  try{
    const writePayload = {
      action: isTax ? 'addTax' : 'addInvoice',
      sheetName: SHEETS[isTax ? 'tax' : 'invoices'],
      data,
      photoBase64: f._photoBase64 || ''
    };
    
    const url = S.scriptUrl + '?' + new URLSearchParams({ write: '1', payload: JSON.stringify(writePayload) });
    await fetch(url);
    
    const isChq = f[COLS.taxPayType] === 'שיק';
    const paidAmt = parseFloat(f[COLS.taxPayAmt] || 0);
    const invTotal = Math.round(calc.withVat); // Strict whole integer grounding
    const isOverpay = isChq && invTotal > 0 && paidAmt > invTotal + 0.5;

    if (isTax && isOverpay && f._overInvNum?.trim()) {
      const excess = Math.round(paidAmt - invTotal); // Clear integer rounding
      const recData = {
        [COLS.recInvNum]: f._overInvNum.trim(),
        [COLS.recPayType]: f[COLS.taxPayType],
        [COLS.recPayAmt]: String(excess),
        [COLS.recPayDate]: f[COLS.taxPayDate] || tod(),
        [COLS.recChkNum]: f[COLS.taxChkNum] || '',
        [COLS.recNotes]: 'יתרת שיק מחשמ"ק שנוצר עכשיו'
      };
      
      const url2 = S.scriptUrl + '?' + new URLSearchParams({ write: '1', payload: JSON.stringify({ action: 'addReceipt', data: recData, photoBase64: f._photoBase64 || '' }) });
      await fetch(url2);
      
      recData[COLS.recCustName] = f[COLS.docCustName] || '';
      recData[COLS.recCustId] = f[COLS.docCustId] || '';
      S.receipts.push({...recData, _id:S.receipts.length, _bg:'#ffffff'});
    }
    
    S.msg={t:'s',m:(isTax?'חשמ"ק':'חשבונית')+' נשמרה! '+(qtySummary||'ללא כמויות')};
    S.saving=false;render();
    setTimeout(()=>{
      S.screen='list';S.iForm={};S.msg=null;
      if(isTax){S.tsState='idle';S.tax=[];}else{S.isState='idle';S.invoices=[];}
      setHeader();if(isTax)loadTax();else loadInvoices();
    },2500);
  }catch(e){
    showToast('❌ Error: Network Connection Failed', 'err');
    S.saving=false;
    render(); 
  }
}

function renderSaveBtn(){
  const btn=document.getElementById('btn-save-inv');
  if(!btn)return;
  const isTax = S.screen==='new-tax';
  const validErr = isTax ? taxFormErrors() : invoiceFormErrors();
  const dis = S.saving || !!validErr;
  btn.disabled = dis;
  btn.style.background = dis ? '#ccc' : tc();
  btn.textContent = S.saving ? '⏳ שומר...' : (validErr ? '⛔ ' + validErr : (isTax ? '💾 שמור חשמ"ק' : '💾 שמור חשבונית'));
}

function renderSaveBtnRec(){
  const btn=document.getElementById('btn-save-rec');
  if(!btn)return;
  const validErr = receiptFormErrors();
  const dis = S.saving || !!validErr;
  btn.disabled = dis;
  btn.style.background = dis ? '#ccc' : tc();
  btn.textContent = S.saving ? '⏳ שומר...' : (validErr ? '⛔ ' + validErr : '💾 שמור קבלה');
}

window.addEventListener('DOMContentLoaded',()=>{
  S.cForm=efC();S.rForm=efR();S.tab='customers';S.screen='list';
  setHeader();
  syncNav();
  requestAnimationFrame(syncNav);

  window.addEventListener('beforeunload',e=>{
    e.preventDefault();
    return e.returnValue='Are you sure you want to exit?';
  });

  history.pushState(null,'',location.href);
  window.addEventListener('popstate',()=>{
    if(S.screen!=='list'){
      history.pushState(null,'',location.href);
      goBack();
    }else{
      if(confirm('Are you sure you want to exit?')){
        history.back();
      }else{
        history.pushState(null,'',location.href);
      }
    }
  });

  if(S.scriptUrl){render();pingSheets().then(()=>loadCustomers());}
  else render();
});
</script>
</body>
</html>
