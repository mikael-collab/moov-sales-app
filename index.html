<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOOV Sales">
<title>MOOV Sales</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Heebo','Arial Hebrew',Arial,sans-serif;background:#f0f0f0;}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:#f5f5f5;overflow:hidden;}

/* Header */
.hdr{flex-shrink:0;padding:12px 14px 10px;color:#fff;transition:background .3s;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;}
.hdr-mid{text-align:center;flex:1;}
.hdr-mid h1{font-size:16px;font-weight:600;margin:0;}
.hdr-mid p{font-size:11px;opacity:.75;}
.hdr-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;width:36px;height:36px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.hdr-btn.hidden{visibility:hidden;}

#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* Bottom nav */
.bnav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid #e0e0e0;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 10px;border:none;background:transparent;cursor:pointer;font-family:inherit;border-top:2.5px solid transparent;transition:all .2s;color:#aaa;}
.bnav-btn.active{border-top-color:var(--tc);background:var(--tbg);color:var(--tc);}
.bnav-btn .ico{font-size:18px;margin-bottom:2px;}
.bnav-btn .lbl{font-size:9px;font-weight:500;white-space:nowrap;}

/* Setup */
.setup-screen{display:flex;flex-direction:column;height:100%;}
.setup-hero{background:linear-gradient(135deg,#1a73e8,#0d47a1);padding:36px 24px 32px;text-align:center;color:#fff;flex-shrink:0;}
.setup-hero .logo{font-size:48px;margin-bottom:10px;}
.setup-hero h2{font-size:22px;font-weight:700;margin-bottom:4px;}
.setup-hero p{font-size:13px;opacity:.8;line-height:1.5;}
.setup-body{flex:1;overflow-y:auto;padding:20px 14px 30px;}
.setup-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;border:.5px solid #e8e8e8;}
.setup-card h3{font-size:14px;font-weight:600;color:#222;margin-bottom:12px;}
.step-row{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start;}
.step-num{background:#1a73e8;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;}
.step-txt{font-size:13px;color:#444;line-height:1.6;flex:1;}
.step-txt b{color:#222;}

/* Inputs */
.url-input{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;font-family:inherit;background:#f8f8f8;outline:none;direction:ltr;text-align:left;-webkit-appearance:none;margin-bottom:10px;}
.url-input:focus{border-color:#1a73e8;background:#fff;}
.url-input.err{border-color:#c62828;}
.url-err{font-size:12px;color:#c62828;margin-bottom:8px;display:none;line-height:1.5;}
.save-url-btn{width:100%;padding:13px;border-radius:10px;background:#1a73e8;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;-webkit-appearance:none;}
.url-hint{font-size:11px;color:#aaa;text-align:center;margin-top:8px;line-height:1.6;}

/* Settings */
.settings-screen{padding:20px 14px 30px;}
.stitle{font-size:11px;font-weight:600;color:#aaa;margin-bottom:8px;letter-spacing:.5px;}
.scard{background:#fff;border-radius:12px;border:.5px solid #ebebeb;overflow:hidden;margin-bottom:14px;}
.srow{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-top:.5px solid #f0f0f0;}
.srow:first-child{border-top:none;}
.slabel{font-size:13px;color:#444;font-weight:500;}
.sval{font-size:11px;color:#aaa;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;}
.sbtn{background:none;border:none;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;}
.sbtn.red{color:#c62828;}
.sbtn.blue{color:#1a73e8;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle;}

/* Debug box */
.debug-box{background:#1a1a2e;border-radius:10px;padding:12px;margin-top:12px;font-family:monospace;font-size:11px;color:#a0cfff;max-height:160px;overflow-y:auto;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;}

/* Search */
.sbar{background:#fff;border-bottom:1px solid #ebebeb;padding:10px 12px;position:sticky;top:0;z-index:10;}
.swrap{position:relative;}
.sinput{width:100%;padding:10px 36px 10px 30px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;background:#f8f8f8;outline:none;direction:rtl;-webkit-appearance:none;transition:border-color .2s;}
.sinput:focus{background:#fff;}
.sico{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.sclr{position:absolute;left:9px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:#bbb;cursor:pointer;line-height:1;}
.smeta{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:#aaa;}
.sref{background:none;border:none;font-size:11px;font-family:inherit;cursor:pointer;}

/* Cards — background comes from sheet _bg field */
.card{margin:0 10px 5px;border-radius:11px;overflow:hidden;border:1.5px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .2s;}
.card.exp{border-color:var(--tc) !important;box-shadow:0 3px 12px rgba(0,0,0,.12);}
.card-hdr{padding:12px 14px;cursor:pointer;user-select:none;}
.r1{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap;}
.r2{display:flex;gap:9px;font-size:12px;color:#555;flex-wrap:wrap;align-items:center;}
.r3{margin-top:5px;display:flex;justify-content:space-between;align-items:center;}
.card-body{border-top:1.5px solid rgba(0,0,0,.07);padding:12px 14px 14px;background:#fff;}

.cust-name{font-weight:600;font-size:15px;color:#1a1a1a;flex-shrink:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.biz-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.toggle-hint{font-size:11px;}
.id-badge{font-size:12px;color:#444;background:rgba(0,0,0,.09);border-radius:6px;padding:2px 8px;font-family:monospace;letter-spacing:1px;flex-shrink:0;}
.copy-btn{border:1px solid rgba(0,0,0,.18);border-radius:6px;padding:2px 8px;font-size:11px;background:rgba(255,255,255,.6);color:#444;cursor:pointer;font-family:inherit;flex-shrink:0;}
.copy-btn.done{color:#fff;}
.tag{font-size:11px;background:rgba(0,0,0,.08);border-radius:5px;padding:1px 7px;color:#444;white-space:nowrap;}
.tag.blue{background:#ddeeff;color:#1a73e8;}
.nbadge{color:#fff;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600;display:inline-block;}

/* Detail grids */
.sec-t{font-size:11px;font-weight:600;color:#aaa;margin-bottom:8px;letter-spacing:.5px;}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.gcell{background:#f8f8f8;border-radius:8px;padding:8px 10px;border:.5px solid #ebebeb;}
.gcell.wide{grid-column:span 2;}
.glabel{font-size:10px;color:#aaa;margin-bottom:2px;}
.gval{font-size:13px;font-weight:500;color:#222;word-break:break-all;}
.dtable{background:#fff;border-radius:10px;border:.5px solid #ebebeb;overflow:hidden;margin-bottom:10px;}
.dthead{padding:8px 12px;font-size:12px;font-weight:600;color:#fff;display:flex;justify-content:space-between;}
.dtrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-top:.5px solid #f0f0f0;}
.dtlabel{font-size:12px;color:#666;}
.dtval{font-size:13px;font-weight:500;color:#222;}

/* Products */
.prod-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:.5px solid #f0f0f0;}
.prod-em{font-size:20px;margin-left:8px;}
.prod-name{font-size:13px;font-weight:500;color:#222;}
.prod-sub{font-size:10px;color:#aaa;}
.prod-qty{font-size:15px;font-weight:700;}

/* Summary bar */
.sumbar{margin:10px 10px 8px;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;color:#fff;}

/* Form */
.fwrap{padding:14px 14px 30px;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;}
.divider hr{flex:1;border:none;border-top:.5px solid #ddd;}
.divider span{font-size:12px;font-weight:600;color:#aaa;white-space:nowrap;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:5px;}
.field label small{font-size:11px;color:#bbb;font-weight:400;}
.field input{display:block;width:100%;padding:11px 13px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:inherit;background:#f8f8f8;outline:none;direction:rtl;-webkit-appearance:none;transition:border-color .2s;}
.field input:focus{border-color:var(--tc,#1a73e8);background:#fff;}
.field input.num{direction:ltr;text-align:right;font-family:monospace;letter-spacing:1px;}
.irow{display:flex;gap:8px;}
.dash-btn{padding:11px 17px;border-radius:10px;border:1.5px solid var(--tc,#1a73e8);background:transparent;color:var(--tc,#1a73e8);font-size:22px;font-weight:700;line-height:1;cursor:pointer;flex-shrink:0;}
.save-btn{width:100%;padding:14px;border-radius:10px;color:#fff;border:none;font-size:16px;font-weight:600;margin-top:10px;cursor:pointer;-webkit-appearance:none;}
.save-btn:disabled{background:#ccc !important;cursor:wait;}
.alert{padding:12px 14px;border-radius:10px;font-weight:500;text-align:center;font-size:14px;margin-bottom:14px;}
.alert.ok{background:#e6f4ea;color:#1e8e3e;}
.alert.err{background:#fce8e6;color:#c62828;}

/* Status */
.status{padding:48px 16px;text-align:center;}
.spinner{width:36px;height:36px;border:3px solid #f0f0f0;border-top-color:#1a73e8;border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <div class="hdr" id="hdr" style="background:#1a73e8">
    <div class="hdr-row">
      <button class="hdr-btn hidden" id="back-btn" onclick="goBack()">←</button>
      <div class="hdr-mid">
        <h1 id="hdr-title">לקוחות</h1>
        <p>מיקאל קולמן | MOOV</p>
      </div>
      <button class="hdr-btn" id="right-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div id="content"></div>

  <div class="bnav" id="bnav">
    <button class="bnav-btn active" data-tab="customers" onclick="switchTab('customers')" style="--tc:#1a73e8;--tbg:#e8f0fe;color:#1a73e8">
      <span class="ico">👥</span><span class="lbl">לקוחות</span>
    </button>
    <button class="bnav-btn" data-tab="invoices" onclick="switchTab('invoices')" style="--tc:#d67000;--tbg:#fff3e0">
      <span class="ico">📄</span><span class="lbl">חשבוניות</span>
    </button>
    <button class="bnav-btn" data-tab="receipts" onclick="switchTab('receipts')" style="--tc:#1e8e3e;--tbg:#e6f4ea">
      <span class="ico">🧾</span><span class="lbl">קבלות</span>
    </button>
    <button class="bnav-btn" data-tab="tax" onclick="switchTab('tax')" style="--tc:#7b1fa2;--tbg:#f3e5f5">
      <span class="ico">📋</span><span class="lbl">חשמ"ק</span>
    </button>
  </div>
</div>

<script>
const STORAGE_KEY = 'moov_script_url_v2';

const TABS = {
  customers:{ label:'לקוחות',           color:'#1a73e8', bg:'#e8f0fe' },
  invoices: { label:'חשבוניות',          color:'#d67000', bg:'#fff3e0' },
  receipts: { label:'קבלות',             color:'#1e8e3e', bg:'#e6f4ea' },
  tax:      { label:'חשבוניות מס קבלה', color:'#7b1fa2', bg:'#f3e5f5' },
};

// Exact sheet names — must match Google Sheet tabs precisely
// These will be confirmed/corrected from the debug ping
const SHEETS = {
  customers: 'לקוחות',
  invoices:  'חשבוניות',
  receipts:  'קבלות',
  tax:       'חשבוניות מס קבלה',
};

const CF = [
  {k:'A',label:'שם לקוח',      mode:'text', req:true},
  {k:'B',label:'ת"ז / ח"פ',   mode:'num',  copy:true},
  {k:'C',label:'שם העסק',       mode:'text'},
  {k:'D',label:'טלפון',         mode:'tel'},
  {k:'E',label:'כתובת מייל',    mode:'email'},
  {k:'F',label:'רחוב ומספר',    mode:'text'},
  {k:'G',label:'עיר',           mode:'text'},
  {k:'H',label:'שם בעל החשבון', mode:'text', bank:true},
  {k:'I',label:'שם הבנק',       mode:'text', bank:true},
  {k:'J',label:'מספר הסניף',    mode:'num',  bank:true},
  {k:'K',label:'מספר חשבון',    mode:'num',  bank:true},
];

const PRODS = [
  {qk:'E', label:'Blueberry Mint 10',  heb:'אוכמניות',     nic:10, em:'🫐'},
  {qk:'G', label:'Jalapeno Lime 14',   heb:'חלפיניו ליים', nic:14, em:'🌶'},
  {qk:'I', label:'Jalapeno Lime 6',    heb:'חלפיניו ליים', nic:6,  em:'🌶'},
  {qk:'K', label:'Peppermint 20',      heb:'מנטה',         nic:20, em:'🌿'},
  {qk:'M', label:'Peppermint 10',      heb:'מנטה',         nic:10, em:'🌿'},
  {qk:'O', label:'Peppermint 3',       heb:'מנטה',         nic:3,  em:'🌿'},
  {qk:'Q', label:'Raspberry Soda 10',  heb:'פטל',          nic:10, em:'🍓'},
  {qk:'S', label:'Watermelon 20',      heb:'אבטיח',        nic:20, em:'🍉'},
  {qk:'U', label:'Watermelon 14',      heb:'אבטיח',        nic:14, em:'🍉'},
  {qk:'W', label:'Banana 3',           heb:'בננה',         nic:3,  em:'🍌'},
];

const RF = [
  {k:'A',label:'מספר חשבונית',                  icon:'🧾'},
  {k:'B',label:'סוג תשלום',                      icon:'💳'},
  {k:'C',label:'סכום התשלום',                    icon:'₪', money:true},
  {k:'D',label:'תאריך תשלום / תאריך פרעון שיק', icon:'📅'},
  {k:'E',label:'מספר שיק',                       icon:'#'},
  {k:'F',label:'צילום שיק',                      icon:'📷'},
  {k:'G',label:'הערות',                          icon:'📝', wide:true},
  {k:'H',label:'שם לקוח',                        icon:'👤'},
  {k:'I',label:'ת"ז / ח"פ',                      icon:'🪪'},
  {k:'J',label:'מספר קבלה',                      icon:'🔢'},
];

const INV_TAIL = [
  {k:'AD',label:'תנאי תשלום'},
  {k:'AE',label:'סה"כ כולל מע"מ', money:true, hi:true},
  {k:'AF',label:'מספר חשבונית'},
  {k:'AG',label:'סוג תשלום'},
  {k:'AH',label:'סכום התשלום', money:true},
  {k:'AI',label:'תאריך תשלום / תאריך פרעון שיק'},
  {k:'AJ',label:'מספר שיק'},
  {k:'AK',label:'הערות', wide:true},
];

const TAX_TAIL = [
  {k:'AD',label:'סה"כ כולל מע"מ', money:true, hi:true},
  {k:'AE',label:'סוג תשלום'},
  {k:'AF',label:'סכום התשלום', money:true},
  {k:'AG',label:'תאריך תשלום / תאריך פרעון שיק'},
  {k:'AH',label:'מספר שיק'},
  {k:'AI',label:'צילום שיק'},
  {k:'AJ',label:'הערות', wide:true},
  {k:'AK',label:'מספר חשבונית מס / קבלה'},
];

// ── State ──
const S = {
  tab:'customers', screen:'list',
  customers:[], csState:'idle',
  invoices:[],  isState:'idle',
  receipts:[],  rsState:'idle',
  tax:[],       tsState:'idle',
  search:'', expId:null,
  form:{}, saving:false, msg:null,
  copied:null, copiedTimer:null,
  scriptUrl: localStorage.getItem(STORAGE_KEY)||'',
  availableSheets: [],   // filled from ping
  debugLog: [],
};

const tc = ()=> TABS[S.tab].color;

function ef(){ const o={}; CF.forEach(f=>o[f.k]=''); return o; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function fmt(v){
  const n=parseFloat((v||'').toString().replace(/[^0-9.]/g,''));
  if(isNaN(n)) return v||'';
  return '₪'+n.toLocaleString('he-IL',{minimumFractionDigits:0,maximumFractionDigits:2});
}

function formatPhone(v){
  if(!v) return v;
  const d=v.replace(/\D/g,'');
  if(d.length===10&&d.startsWith('0')) return d.slice(0,3)+'-'+d.slice(3);
  if(d.length===9&&d.startsWith('0'))  return d.slice(0,2)+'-'+d.slice(2);
  return v;
}

function isBusy(e){
  const m=(e?.message||'').toLowerCase();
  return m.includes('quota')||m.includes('rate')||m.includes('limit')||m.includes('429');
}

function dbg(msg){
  const ts=new Date().toLocaleTimeString('he-IL');
  S.debugLog.unshift('['+ts+'] '+msg);
  if(S.debugLog.length>30) S.debugLog.pop();
}

// ── API ──
async function apiFetch(params){
  if(!S.scriptUrl) throw new Error('NO_URL');
  const url=S.scriptUrl+'?'+new URLSearchParams(params);
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  if(d.error) throw new Error(d.error+(d.available?' | Available: '+d.available.join(', '):''));
  return d;
}
async function apiPost(body){
  if(!S.scriptUrl) throw new Error('NO_URL');
  const r=await fetch(S.scriptUrl,{method:'POST',body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}

// Ping — gets list of sheet names to verify connection and confirm exact names
async function pingSheets(){
  try{
    const d=await apiFetch({});
    if(d.sheets){
      S.availableSheets=d.sheets;
      dbg('Sheets found: '+d.sheets.join(' | '));
      // Auto-match sheet names (case-insensitive trim)
      d.sheets.forEach(name=>{
        const n=name.trim();
        if(/לקוח/.test(n))         SHEETS.customers=n;
        else if(/מס קבלה/.test(n)) SHEETS.tax=n;
        else if(/חשבוני/.test(n))  SHEETS.invoices=n;
        else if(/קבלו/.test(n))    SHEETS.receipts=n;
      });
      dbg('Mapped → '+JSON.stringify(SHEETS));
    }
  }catch(e){ dbg('Ping error: '+e.message); }
}

// ── Loaders ──
async function loadAny(tab, stateKey, limit){
  S[stateKey]='loading'; render();
  const sheetName=SHEETS[tab];
  dbg('Loading ['+sheetName+'] limit='+limit);
  try{
    const params={sheet:sheetName};
    if(limit) params.limit=limit;
    const d=await apiFetch(params);
    const rows=(d.data||[]).map((r,i)=>({...r,_id:i}));
    S[tab]=rows;
    S[stateKey]='ok';
    dbg('['+sheetName+'] → '+rows.length+' rows loaded');
  }catch(e){
    S[stateKey]=isBusy(e)?'busy':'error';
    dbg('Error ['+sheetName+']: '+e.message);
  }
  render();
}

const loadCustomers=()=>loadAny('customers','csState',0);
const loadInvoices =()=>loadAny('invoices', 'isState',20);
const loadReceipts =()=>loadAny('receipts', 'rsState',20);
const loadTax      =()=>loadAny('tax',      'tsState',20);

// ── Navigation ──
function switchTab(tab){
  S.tab=tab; S.screen='list'; S.search=''; S.expId=null; S.msg=null;
  document.querySelectorAll('.bnav-btn').forEach(b=>{
    const a=b.dataset.tab===tab;
    b.classList.toggle('active',a);
    b.style.color=a?TABS[tab].color:'';
  });
  if(tab==='invoices'&&S.isState==='idle') loadInvoices();
  if(tab==='receipts'&&S.rsState==='idle') loadReceipts();
  if(tab==='tax'&&S.tsState==='idle')      loadTax();
  setHeader(); render();
}

function goBack(){ S.screen='list'; S.msg=null; S.form=ef(); setHeader(); render(); }
function openNewCustomer(){ S.screen='new-customer'; S.form=ef(); S.msg=null; setHeader(); render(); }
function openSettings(){ S.screen='settings'; setHeader(); render(); }

function setHeader(){
  document.getElementById('hdr').style.background=S.screen==='settings'?'#37474f':tc();
  const titles={'list':TABS[S.tab]?.label,'new-customer':'+ לקוח חדש','settings':'⚙️ הגדרות'};
  document.getElementById('hdr-title').textContent=titles[S.screen]||TABS[S.tab]?.label||'';
  const back=document.getElementById('back-btn');
  const right=document.getElementById('right-btn');
  back.classList.toggle('hidden', S.screen==='list');
  if(S.screen==='settings'){
    right.classList.add('hidden');
  } else if(S.tab==='customers'&&S.screen==='list'){
    right.classList.remove('hidden');
    right.textContent='+'; right.onclick=openNewCustomer;
  } else {
    right.classList.remove('hidden');
    right.textContent='⚙️'; right.onclick=openSettings;
  }
}

// ── Render ──
function render(){
  const el=document.getElementById('content');
  const pos=el.scrollTop;
  if(!S.scriptUrl&&S.screen!=='settings'){
    el.innerHTML=renderSetup();
    document.getElementById('bnav').style.display='none';
    el.scrollTop=pos; bindInputs(); return;
  }
  document.getElementById('bnav').style.display='flex';
  if(S.screen==='settings')          el.innerHTML=renderSettings();
  else if(S.tab==='customers')       el.innerHTML=S.screen==='list'?renderCustList():renderForm();
  else if(S.tab==='invoices')        el.innerHTML=renderInvList(S.invoices,S.isState,false);
  else if(S.tab==='receipts')        el.innerHTML=renderRecList();
  else                               el.innerHTML=renderInvList(S.tax,S.tsState,true);
  el.scrollTop=pos; bindInputs();
}

function saveUrl(inputId, errId){
  const inp=document.getElementById(inputId);
  const errEl=document.getElementById(errId);
  const val=(inp?.value||'').trim();
  if(!val||!val.startsWith('https://script.google.com')){
    if(inp) inp.classList.add('err');
    if(errEl){errEl.textContent='URL לא תקין — חייב להתחיל ב-https://script.google.com';errEl.style.display='block';}
    return;
  }
  S.scriptUrl=val;
  localStorage.setItem(STORAGE_KEY,val);
  resetAll();
  S.screen='list'; S.tab='customers';
  document.getElementById('bnav').style.display='flex';
  setHeader();
  pingSheets().then(()=>loadCustomers());
}

function clearUrl(){
  if(!confirm('למחוק את ה-URL השמור?')) return;
  S.scriptUrl=''; localStorage.removeItem(STORAGE_KEY);
  resetAll();
  S.screen='list'; document.getElementById('bnav').style.display='none';
  setHeader(); render();
}

function resetAll(){
  S.csState='idle'; S.isState='idle'; S.rsState='idle'; S.tsState='idle';
  S.customers=[]; S.invoices=[]; S.receipts=[]; S.tax=[];
  S.availableSheets=[]; S.debugLog=[];
}

function refreshAll(){
  resetAll(); S.screen='list'; setHeader();
  pingSheets().then(()=>loadCustomers());
}

function filteredC(){

  return S.customers.filter(c=>['A','B','C','D','E','F','G'].some(k=>(c[k]||'').toLowerCase().includes(q)));

function renderCustList(){

      ${S.search?`<button class="sclr" onclick="clearSearch()">×</button>`:''}
    </div>

// rowBg: use _bg from sheet; if white use plain white, else use the sheet color
function rowBg(r, isExp){
  if(isExp) return '#ffffff';
  const bg=(r._bg||'#ffffff').toLowerCase();
  if(bg==='#ffffff'||bg==='#fff'||bg===''||bg==='white') return '#ffffff';
  return bg;
}

function cCard(c,i){
  const isE=S.expId===c._id;
  const bg=rowBg(c,isE);
  const cpd=S.copied===`${c._id}-B`;
  const bank=c.H||c.I||c.J||c.K;
  const color=tc();
  return `<div class="card${isE?' exp':''}" style="background:${bg};${isE?`--tc:${color}`:''}">
    <div class="card-hdr" onclick="tog(${c._id})">
      <div class="r1">
        <span class="cust-name">${esc(c.A||'—')}</span>
        ${c.B?`<span class="id-badge">${esc(c.B)}</span>
          <button class="copy-btn${cpd?' done':''}" onclick="event.stopPropagation();cp('${esc(c.B)}','${c._id}-B')"
            style="${cpd?`background:${color};border-color:${color};color:#fff`:''}">
            ${cpd?'✓ הועתק':'📋 העתק'}</button>`:''}
        ${c.C?`<span class="biz-name" style="color:${color}">${esc(c.C)}</span>`:''}
      </div>
      <div class="r2">
        ${c.D?`<span>📱 ${esc(c.D)}</span>`:''}
        ${c.E?`<span style="direction:ltr;overflow:hidden;text-overflow:ellipsis;max-width:160px">✉ ${esc(c.E)}</span>`:''}
        ${(c.F||c.G)?`<span>📍 ${esc([c.F,c.G].filter(Boolean).join(', '))}</span>`:''}
      </div>
      <div class="r3">
        ${bank&&!isE?`<span class="tag">🏦 פרטי בנק</span>`:'<span></span>'}
        <span class="toggle-hint" style="color:${isE?color:'#bbb'}">${isE?'▲ סגור':'▼ פרטים'}</span>
      </div>
    </div>
    ${isE?cCardBody(c,color):''}
  </div>`;
}

function cCardBody(c,color){
  let h=`<div class="card-body">
    <div class="sec-t">פרטי קשר</div><div class="g2" style="margin-bottom:12px">`;
  CF.filter(f=>!f.bank&&c[f.k]).forEach(f=>{
    h+=`<div class="gcell${['E','F'].includes(f.k)?' wide':''}">
      <div class="glabel">${f.label}</div>
      <div class="gval" style="direction:${f.mode==='email'?'ltr':'rtl'}">${esc(c[f.k])}</div>
    </div>`;
  });
  h+=`</div>`;
  const bankF=CF.filter(f=>f.bank&&c[f.k]);
  if(bankF.length){
    h+=`<div class="sec-t">🏦 פרטי בנק</div><div class="dtable">`;
    bankF.forEach((f,i)=>{
      h+=`<div class="dtrow"${i===0?' style="border-top:none"':''}>
        <span class="dtlabel">${f.label}</span>
        <span class="dtval" style="${['J','K'].includes(f.k)?'font-family:monospace;letter-spacing:1px':''}">${esc(c[f.k])}</span>
      </div>`;
    });
    h+=`</div>`;
  }
  return h+`</div>`;
}

// ── New Customer Form ──
function renderForm(){
  const color=tc();
  let h=`<div class="fwrap" style="--tc:${color}">`;

  h+=`<div class="sec-t">פרטי לקוח</div>`;

    ${S.saving?'⏳ שומר...':'💾 שמור לקוח'}</button></div>`;

}

function fField(f){
  const v=esc(S.form[f.k]||'');
  if(f.k==='B') return `<div class="field">
    <label>${f.label} <small>(עמודה B${f.req?' *':''})</small></label>
    <div class="irow">
      <input type="text" inputmode="numeric" id="f-B" class="num" value="${v}"
        oninput="uf('B',this.value.replace(/[^0-9-]/g,''))">
      <button class="dash-btn" onclick="addDash()">-</button>
    </div></div>`;
  const im=f.mode==='num'?'numeric':f.mode==='tel'?'tel':f.mode==='email'?'email':'text';
  return `<div class="field">
    <label>${f.label} <small>(עמודה ${f.k}${f.req?' *':''})</small></label>
    <input type="${f.mode==='email'?'email':f.mode==='tel'?'tel':'text'}" inputmode="${im}"
      id="f-${f.k}" value="${v}" ${f.mode==='num'?'class="num"':''}
      style="direction:${f.mode==='email'?'ltr':'rtl'}"
      oninput="uf('${f.k}',this.value)">
  </div>`;
}

// ── Invoice / Tax List ──
function renderInvList(data, state, isTax){
  const label=isTax?'חשבוניות מס קבלה':'חשבוניות';
  const reload=isTax?'loadTax()':'loadInvoices()';
  const totalKey=isTax?'AD':'AE';
  const numKey=isTax?'AK':'AF';
  const tail=isTax?TAX_TAIL:INV_TAIL;
  const color=tc();

  if(state!=='ok') return statusHtml(state,reload,label);
  if(!data.length) return `<div class="status"><p style="color:#999;margin-bottom:16px">אין ${label}</p>
    <button onclick="${reload}" style="background:${color};color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer">טען</button></div>`;

  const grand=data.reduce((s,r)=>{const v=parseFloat((r[totalKey]||'').replace(/[^0-9.]/g,''));return s+(isNaN(v)?0:v);},0);
  let h=`<div style="padding-bottom:24px">
    <div class="sumbar" style="background:${color}">
      <span>${data.length} ${isTax?'חשמ"ק':'חשבוניות'} אחרונות</span>
      <span style="font-size:16px;font-weight:700">${fmt(grand.toString())}</span>
    </div>`;

  [...data].reverse().forEach((r,i)=>{
    const id=`${isTax?'t':'v'}-${r._id}`;
    const isE=S.expId===id;
    const bg=rowBg(r,isE);
    const totVAT=r[totalKey]; const invNum=r[numKey];
    const prods=PRODS.filter(p=>parseFloat(r[p.qk])>0);
    const totItems=prods.reduce((s,p)=>s+(parseFloat(r[p.qk])||0),0);

    h+=`<div class="card${isE?' exp':''}" style="background:${bg};${isE?`--tc:${color}`:''}">
      <div class="card-hdr" onclick="tog('${id}')">
        <div class="r1">
          ${invNum?`<span class="nbadge" style="background:${color}">#${esc(invNum)}</span>`:''}
          <span style="font-weight:600;font-size:14px;color:#222;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.B||r.A||'—')}</span>
          ${totVAT?`<span style="font-size:15px;font-weight:700;color:${color};flex-shrink:0">${fmt(totVAT)}</span>`:''}
        </div>
        <div class="r2">
          ${r.C?`<span>📅 ${esc(r.C)}</span>`:''}
          ${prods.slice(0,3).map(p=>`<span class="tag">${p.em} ×${r[p.qk]}</span>`).join('')}
          ${prods.length>3?`<span style="font-size:11px;color:#888">+${prods.length-3}</span>`:''}
          ${totItems>0?`<span style="font-size:11px;color:#aaa;margin-right:auto">${totItems} יח'</span>`:''}
        </div>
        <div class="r3" style="justify-content:flex-end">
          <span class="toggle-hint" style="color:${isE?color:'#bbb'}">${isE?'▲ סגור':'▼ פרטים'}</span>
        </div>
      </div>`;

    if(isE){
      h+=`<div class="card-body">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
          ${r.A?`<span class="id-badge">${esc(r.A)}</span>`:''}
          ${r.B?`<span style="font-size:13px;font-weight:600">${esc(r.B)}</span>`:''}
          ${r.C?`<span style="font-size:12px;color:#888;margin-right:auto">📅 ${esc(r.C)}</span>`:''}
        </div>`;
      if(prods.length){
        h+=`<div class="dtable" style="margin-bottom:10px">
          <div class="dthead" style="background:${color}"><span>פירוט הזמנה</span><span>${totItems} יח'</span></div>`;
        prods.forEach(p=>{
          h+=`<div class="prod-row">
            <div style="display:flex;align-items:center">
              <span class="prod-em">${p.em}</span>
              <div><div class="prod-name">${p.label}</div><div class="prod-sub">${p.heb} • ${p.nic}mg</div></div>
            </div>
            <span class="prod-qty" style="color:${color}">${r[p.qk]} יח'</span>
          </div>`;
        });
        h+=`</div>`;
      }
      const pricing=[
        r.X&&{l:'מחיר ליחידה (לפני מע"מ)',v:fmt(r.X)},
        r.Y&&{l:'סה"כ לפני מע"מ',v:fmt(r.Y)},
        r.Z&&{l:'הנחה',v:r.Z+'%',disc:true},
        r.AA&&{l:'סה"כ אחר הנחה (לפני מע"מ)',v:fmt(r.AA)},
        totVAT&&{l:'סה"כ כולל מע"מ',v:fmt(totVAT),hi:true},
      ].filter(Boolean);
      if(pricing.length){
        h+=`<div class="dtable" style="margin-bottom:10px">`;
        pricing.forEach((row,ri)=>{
          h+=`<div class="dtrow" style="${ri===0?'border-top:none;':''}${row.hi?`background:${color}15`:''}">
            <span class="dtlabel">${row.l}</span>
            <span class="dtval" style="color:${row.hi?color:row.disc?'#c62828':'#222'};font-size:${row.hi?15:13}px;font-weight:${row.hi?700:500}">${row.v}</span>
          </div>`;
        });
        h+=`</div>`;
      }
      h+=`<div class="dtable"><div style="padding:7px 12px;background:#f5f5f5;border-bottom:.5px solid #ebebeb;font-size:12px;font-weight:600;color:#666">פרטי תשלום</div>`;
      tail.filter(f=>r[f.k]&&!f.wide).forEach((f,fi)=>{
        h+=`<div class="dtrow"${fi===0?' style="border-top:none"':''}>
          <span class="dtlabel">${f.label}</span>
          <span class="dtval" style="color:${f.money?color:'#222'}">${f.money?fmt(r[f.k]):esc(r[f.k])}</span>
        </div>`;
      });
      tail.filter(f=>r[f.k]&&f.wide).forEach(f=>{
        h+=`<div style="padding:8px 12px;border-top:.5px solid #f0f0f0">
          <div class="glabel">${f.label}</div>
          <div style="font-size:13px;color:#222;margin-top:2px">${esc(r[f.k])}</div></div>`;
      });
      h+=`</div></div>`;
    }
    h+=`</div>`;
  });
  return h+`</div>`;
}

    <div class="sumbar" style="background:${color}">
      <span>${data.length} קבלות אחרונות</span>
      <span style="font-size:16px;font-weight:700">${fmt(total.toString())}</span>
    </div>`;
  [...data].reverse().forEach((r,i)=>{
    const id=`rec-${r._id}`; const isE=S.expId===id;
    const bg=rowBg(r,isE); const num=r.J||r.A||`#${i+1}`;
    h+=`<div class="card${isE?' exp':''}" style="background:${bg};${isE?`--tc:${color}`:''}">
      <div class="card-hdr" onclick="tog('${id}')">
        <div class="r1" style="justify-content:space-between">
          <div style="display:flex;align-items:center;gap:7px">
            <span class="nbadge" style="background:${color}">קבלה ${esc(num)}</span>
            ${r.H?`<span style="font-weight:600;font-size:14px;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px">${esc(r.H)}</span>`:''}
          </div>
          ${r.C?`<span style="font-size:15px;font-weight:700;color:${color}">${fmt(r.C)}</span>`:''}
        </div>
        <div class="r2">
          ${r.B?`<span class="tag">${esc(r.B)}</span>`:''}
          ${r.D?`<span>📅 ${esc(r.D)}</span>`:''}
          ${r.A?`<span style="color:#bbb">חשב׳ ${esc(r.A)}</span>`:''}
          ${r.E?`<span class="tag blue">🏦 שיק</span>`:''}
        </div>
        <div class="r3" style="justify-content:flex-end">
          <span class="toggle-hint" style="color:${isE?color:'#bbb'}">${isE?'▲ סגור':'▼ פרטים'}</span>
        </div>
      </div>`;
    if(isE){
      h+=`<div class="card-body"><div class="g2" style="margin-bottom:8px">`;
      RF.filter(f=>!f.wide&&r[f.k]).forEach(f=>{
        h+=`<div class="gcell"><div class="glabel">${f.icon} ${f.label}</div>
          <div class="gval" style="color:${f.money?color:'#222'}">${f.money?fmt(r[f.k]):esc(r[f.k])}</div></div>`;
      });
      h+=`</div>`;
      RF.filter(f=>f.wide&&r[f.k]).forEach(f=>{
        h+=`<div class="gcell wide" style="margin-bottom:8px"><div class="glabel">${f.icon} ${f.label}</div>
          <div class="gval">${esc(r[f.k])}</div></div>`;
      });
      if(r.F) h+=`<div style="background:#e8f0fe;border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:8px">
        <span>📷</span><span style="font-size:12px;color:#1a73e8;font-weight:500">יש קובץ צילום שיק מצורף</span></div>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  return h+`</div>`;
}

// ── Status ──
function statusHtml(state,reload,label){
  if(state==='loading'||state==='idle')
    return `<div class="status"><div class="spinner"></div><p style="color:#999;font-size:14px">טוען ${label}...</p></div>`;
  if(state==='busy')
    return `<div class="status"><p style="font-size:36px;margin-bottom:12px">🔄</p>
      <p style="font-weight:600;color:#e65100;font-size:16px;margin-bottom:8px">השרת עמוס</p>
      <p style="font-size:13px;color:#888;margin-bottom:16px;line-height:1.7">חריגה ממגבלת ה-API.<br>המתן דקה ונסה שוב.</p>
      <button onclick="${reload}" style="background:#e65100;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer">↻ נסה שוב</button></div>`;
  return `<div class="status"><p style="font-size:36px;margin-bottom:12px">⚠️</p>
    <p style="font-weight:500;color:#c62828;font-size:15px;margin-bottom:16px">שגיאה בטעינה</p>
    <p style="font-size:12px;color:#aaa;margin-bottom:16px">פתח הגדרות ← יומן debug לפרטים</p>
    <button onclick="${reload}" style="background:#c62828;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer">נסה שוב</button></div>`;
}

// ── Events ──
function bindInputs(){
  const si=document.getElementById('sinput');
  if(si){
    si.addEventListener('input',e=>{
      S.search=e.target.value;
      const fc=filteredC();
      const cnt=document.getElementById('scnt');
      if(cnt) cnt.textContent=`${fc.length} לקוחות${S.search?` (מתוך ${S.customers.length})`:''} `;
    });
  }
}

function clearSearch(){ S.search=''; render(); setTimeout(()=>document.getElementById('sinput')?.focus(),50); }

function tog(id){
  S.expId=S.expId===id?null:id;
  render();
  setTimeout(()=>document.querySelector('.card.exp')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

async function cp(text,key){
  try{ await navigator.clipboard.writeText(text); }
  catch{
    const t=document.createElement('textarea');
    t.value=text; t.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); document.execCommand('copy');
    document.body.removeChild(t);
  }
  if(S.copiedTimer) clearTimeout(S.copiedTimer);
  S.copied=key; render();
  S.copiedTimer=setTimeout(()=>{ S.copied=null; render(); },2000);
}

function uf(k,v){ S.form[k]=v; }

function addDash(){
  S.form['B']=(S.form['B']||'')+'-';
  const inp=document.getElementById('f-B');
  if(inp){ inp.value=S.form['B']; inp.focus(); }
}

async function saveCust(){
  if(!S.form.A?.trim()){ S.msg={t:'e',m:'שם לקוח הוא שדה חובה'}; render(); return; }
  if(S.form.D) S.form.D=formatPhone(S.form.D);
  S.saving=true; S.msg=null; render();
  try{
    await apiPost({action:'addCustomer', data:{...S.form}});
    S.customers.push({...S.form, _id:S.customers.length, _bg:'#ffffff'});
    S.msg={t:'s',m:'הלקוח נשמר בהצלחה!'};
    S.saving=false; render();
    setTimeout(()=>{ S.screen='list'; S.form=ef(); S.msg=null; setHeader(); render(); },1500);
  }catch(e){
    S.msg={t:'e',m:e.message||'שגיאה בשמירה'};
    S.saving=false; render();
  }
}

// ── Init ──
window.addEventListener('DOMContentLoaded',()=>{
  S.form=ef();
  setHeader();
  if(S.scriptUrl){
    render();
    pingSheets().then(()=>loadCustomers());
  } else {
    render();
  }
});
</script>
